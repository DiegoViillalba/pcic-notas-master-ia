<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O, Omega y Theta</title>
<style>
:root{color-scheme:light dark;--bg:#f7f8fc;--panel:#fff;--ink:#202536;--muted:#667085;--line:#c7cddd;--blue:#2563eb;--green:#16834a;--amber:#b76b08;--purple:#7c3aed;--soft:#eef2ff}
*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:900px;margin:auto}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}h2{margin:0 0 3px;font-size:21px}.subtitle{margin:0;color:var(--muted)}.modes{display:flex;gap:7px;flex-wrap:wrap}.modes button{min-height:38px;padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);cursor:pointer}.modes button[aria-pressed="true"]{border-color:var(--blue);background:var(--soft);font-weight:800}.plot{margin-top:12px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}canvas{display:block;width:100%;height:360px}.legend{display:flex;gap:16px;flex-wrap:wrap;margin:8px 4px 2px;color:var(--muted);font-size:13px}.key::before{content:"";display:inline-block;width:19px;height:3px;margin-right:6px;vertical-align:middle;background:var(--key)}.detail{display:grid;grid-template-columns:minmax(150px,.38fr) minmax(0,1fr);gap:12px;margin-top:12px}.definition,.interpretation{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}.symbol{color:var(--blue);font-size:26px;font-weight:800}.definition code{display:block;margin-top:4px;color:var(--muted)}.interpretation h3{margin:0 0 5px;font-size:17px}.interpretation p{margin:0}.math{margin-top:7px;color:var(--green);font-weight:800;font-variant-numeric:tabular-nums}
@media(max-width:620px){body{padding:12px}.detail{grid-template-columns:1fr}canvas{height:310px}}
@media(prefers-color-scheme:dark){:root{--bg:#1f232c;--panel:#292e39;--ink:#f0f2f7;--muted:#b5bdcd;--line:#596274;--blue:#7fb1ff;--green:#75d99b;--amber:#f1be62;--purple:#c4a7ff;--soft:#2b4669}}
</style>
<main id="bounds-viz">
  <div class="top">
    <div><h2>Una función, tres preguntas</h2><p class="subtitle">f(n) = 32n² + 17n + 1, con n ≥ 1</p></div>
    <div class="modes" role="group" aria-label="Seleccionar cota">
      <button type="button" data-mode="o" aria-pressed="true">O: techo</button>
      <button type="button" data-mode="omega" aria-pressed="false">Ω: piso</button>
      <button type="button" data-mode="theta" aria-pressed="false">Θ: sándwich</button>
    </div>
  </div>
  <div class="plot">
    <canvas id="chart" role="img" aria-label="Gráfica de f de n comparada con cotas cuadráticas"></canvas>
    <div class="legend" id="legend"></div>
  </div>
  <section class="detail" aria-live="polite">
    <div class="definition"><div class="symbol" id="symbol"></div><code id="short"></code></div>
    <div class="interpretation"><h3 id="question"></h3><p id="answer"></p><div class="math" id="math"></div></div>
  </section>
</main>
<script>
const modes={
 o:{symbol:'O(n²)',short:'f(n) ≤ c·n²',question:'¿Qué tan grande puede llegar a ser?',answer:'Desde n₀ = 1, la función nunca supera el techo cuadrático elegido.',math:'f(n) ≤ 50n²',lines:['upper','f']},
 omega:{symbol:'Ω(n²)',short:'f(n) ≥ c·n²',question:'¿Qué tan pequeña puede ser?',answer:'Desde n₀ = 1, la función nunca cae por debajo del piso cuadrático.',math:'32n² ≤ f(n)',lines:['f','lower']},
 theta:{symbol:'Θ(n²)',short:'c₁n² ≤ f(n) ≤ c₂n²',question:'¿Cuál es su orden exacto de crecimiento?',answer:'La misma familia funciona como techo y como piso; f queda atrapada entre dos múltiplos de n².',math:'32n² ≤ f(n) ≤ 50n²',lines:['upper','f','lower']}
};
const root=document.getElementById('bounds-viz'),canvas=document.getElementById('chart'),legend=document.getElementById('legend'),symbol=document.getElementById('symbol'),short=document.getElementById('short'),question=document.getElementById('question'),answer=document.getElementById('answer'),math=document.getElementById('math');let mode='o';
function css(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim()}
function draw(){const box=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1,w=Math.max(300,box.width),h=box.height;canvas.width=w*dpr;canvas.height=h*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);const L=55,R=18,T=20,B=42,pw=w-L-R,ph=h-T-B,x=n=>L+n/10*pw,y=v=>T+(1-v/5200)*ph;c.clearRect(0,0,w,h);c.strokeStyle=css('--line');c.fillStyle=css('--muted');c.lineWidth=1;c.font='12px system-ui';c.textAlign='center';[0,2,4,6,8,10].forEach(n=>{c.beginPath();c.moveTo(x(n),T);c.lineTo(x(n),h-B);c.stroke();c.fillText(String(n),x(n),h-B+20)});c.textAlign='right';[0,1000,2000,3000,4000,5000].forEach(v=>{c.beginPath();c.moveTo(L,y(v));c.lineTo(w-R,y(v));c.stroke();c.fillText(v===0?'0':`${v/1000}k`,L-8,y(v)+4)});c.fillStyle=css('--ink');c.textAlign='center';c.fillText('tamaño n',L+pw/2,h-7);c.save();c.translate(14,T+ph/2);c.rotate(-Math.PI/2);c.fillText('operaciones',0,0);c.restore();c.setLineDash([5,5]);c.strokeStyle=css('--muted');c.beginPath();c.moveTo(x(1),T);c.lineTo(x(1),h-B);c.stroke();c.setLineDash([]);c.fillStyle=css('--muted');c.textAlign='left';c.fillText('n₀ = 1',x(1)+5,T+14);const defs={upper:{fn:n=>50*n*n,color:'--amber'},f:{fn:n=>32*n*n+17*n+1,color:'--blue'},lower:{fn:n=>32*n*n,color:'--green'}};modes[mode].lines.forEach(name=>{const d=defs[name];c.strokeStyle=css(d.color);c.lineWidth=name==='f'?3:2;c.beginPath();for(let i=0;i<=160;i++){const n=i/16,v=d.fn(n);if(i===0)c.moveTo(x(n),y(v));else c.lineTo(x(n),y(v))}c.stroke()});legend.innerHTML=modes[mode].lines.map(name=>{const labels={upper:'techo 50n²',f:'f(n)',lower:'piso 32n²'},vars={upper:'--amber',f:'--blue',lower:'--green'};return `<span class="key" style="--key:var(${vars[name]})">${labels[name]}</span>`}).join('')}
function update(){root.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));const d=modes[mode];symbol.textContent=d.symbol;short.textContent=d.short;question.textContent=d.question;answer.textContent=d.answer;math.textContent=d.math;draw()}
root.querySelector('.modes').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;update()});new ResizeObserver(draw).observe(canvas);matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);update();
</script>
</html>
