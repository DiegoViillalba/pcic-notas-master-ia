<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-label="Un ciclo y un corte en un árbol generador mínimo"><title>Un ciclo y un corte en un árbol generador mínimo</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#425f9c"/></marker></defs><rect width="100%" height="100%" fill="#fbfcff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18243a}.title{font-size:22px;font-weight:700}.label{font-size:16px;font-weight:600}.small{font-size:14px}.node{fill:#fff;stroke:#314b79;stroke-width:2.5}.green{stroke:#13815d;stroke-width:5}.blue{stroke:#425f9c;stroke-width:4}.red{stroke:#b5483d;stroke-width:4}.gray{stroke:#99a7bb;stroke-width:2.5}.dash{stroke-dasharray:8 7}</style><text x="430" y="35" class="title" text-anchor="middle">Corte y ciclo: dos intercambios</text><rect x="26" y="63" width="350" height="200" rx="10" fill="#eaf5ef"/><text x="195" y="90" class="label" text-anchor="middle">S = {a,b}</text><line x1="170" y1="145" x2="175" y2="230" class="green"/><line x1="170" y1="145" x2="540" y2="145" class="red"/><line x1="175" y1="230" x2="540" y2="145" class="blue"/><line x1="175" y1="230" x2="545" y2="230" class="gray"/><line x1="540" y1="145" x2="545" y2="230" class="green"/><circle cx="170" cy="145" r="25" class="node" fill="#fff"/><text x="170" y="151" class="label" text-anchor="middle">a</text><circle cx="175" cy="230" r="25" class="node" fill="#fff"/><text x="175" y="236" class="label" text-anchor="middle">b</text><circle cx="540" cy="145" r="25" class="node" fill="#fff"/><text x="540" y="151" class="label" text-anchor="middle">c</text><circle cx="545" cy="230" r="25" class="node" fill="#fff"/><text x="545" y="236" class="label" text-anchor="middle">d</text><text x="130" y="197" class="small" text-anchor="middle">1</text><text x="350" y="125" class="small" text-anchor="middle">4</text><text x="344" y="178" class="small" text-a