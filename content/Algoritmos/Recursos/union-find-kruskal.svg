<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-label="Union-Find detecta si una arista conecta componentes diferentes"><title>Union-Find detecta si una arista conecta componentes diferentes</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#425f9c"/></marker></defs><rect width="100%" height="100%" fill="#fbfcff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18243a}.title{font-size:22px;font-weight:700}.label{font-size:16px;font-weight:600}.small{font-size:14px}.node{fill:#fff;stroke:#314b79;stroke-width:2.5}.green{stroke:#13815d;stroke-width:5}.blue{stroke:#425f9c;stroke-width:4}.red{stroke:#b5483d;stroke-width:4}.gray{stroke:#99a7bb;stroke-width:2.5}.dash{stroke-dasharray:8 7}</style><text x="430" y="35" class="title" text-anchor="middle">Kruskal consulta raíces antes de unir</text><line x1="220" y1="110" x2="145" y2="220" class="green"/><line x1="220" y1="110" x2="300" y2="220" class="green"/><line x1="605" y1="110" x2="540" y2="220" class="green"/><circle cx="220" cy="110" r="25" class="node" fill="#fff"/><text x="220" y="116" class="label" text-anchor="middle">1</text><circle cx="145" cy="220" r="25" class="node" fill="#fff"/><text x="145" y="226" class="label" text-anchor="middle">2</text><circle cx="300" cy="220" r="25" class="node" fill="#fff"/><text x="300" y="226" class="label" text-anchor="middle">3</text><circle cx="605" cy="110" r="25" class="node" fill="#fff"/><text x="605" y="116" class="label" text-anchor="middle">4</text><circle cx="540" cy="220" r="25" class="node" fill="#fff"/><text x="540" y="226" class="label" text-anchor="middle">5</text><line x1="325" y1="220" x2="515" y2="220" class="blue dash"/><text x="420" y="205" class="small" text-anchor="middle">¿agregar 3–5?</text><text x="430" y="285" class="small" text-anchor="middle">find(3)=1 ≠ find(5)=4  ⇒  no hay ciclo; después union(3,5)</text></svg>