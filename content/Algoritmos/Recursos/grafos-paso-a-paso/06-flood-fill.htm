<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flood fill: una componente de píxeles</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#171b23);--fg:light-dark(#172333,#edf1f7);--mut:light-dark(#586579,#bbc7d7);--line:light-dark(#a4aebd,#778497);--on:light-dark(#096cba,#76c8ff);--done:light-dark(#187343,#80dca3);--soft:light-dark(#e7f3fc,#193851)}
*{box-sizing:border-box}body{margin:0;padding:20px;font:16px/1.55 system-ui;background:var(--bg);color:var(--fg)}h1{font-size:22px;margin:0 0 14px}h2{font-size:18px;margin:12px 0}button,select,input{font:inherit}button,select{padding:8px 12px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px}button:disabled{opacity:.4}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--on)}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}input{width:100%;accent-color:var(--on)}.grid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(270px,1fr);gap:24px}.diagram{width:100%;max-height:430px}svg text{fill:var(--fg);font:16px system-ui}.edge{stroke:var(--line);stroke-width:2}.edge.active{stroke:var(--on);stroke-width:5}.tree{stroke:var(--done);stroke-width:4}.node{fill:var(--bg);stroke:var(--line);stroke-width:2}.seen{fill:var(--soft);stroke:var(--on)}.current{stroke:var(--on);stroke-width:5}.done{stroke:var(--done);stroke-width:3}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:center;border-bottom:1px solid var(--line);padding:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);padding:10px}p{margin:8px 0}.legend{color:var(--mut);font-size:14px}.scroll{overflow:auto}#explain{min-height:90px}@media(max-width:650px){.grid{grid-template-columns:1fr}body{padding:12px}.diagram{max-height:360px}}
</style><main id="ada"><h1>Flood fill: una componente de píxeles</h1><div class="controls"><button id="prev">← Anterior</button><button id="next">Siguiente →</button><span id="count"></span></div><label for="step">Ir a un paso</label><input id="step" type="range" min="0" value="0"><label for="jump">Escena: </label><select id="jump" style="max-width:100%"></select><h2 id="heading"></h2><div class="grid"><div><svg class="diagram" id="graph" viewBox="0 0 460 410" role="img" aria-label="Grafo del paso actual"></svg><p class="legend">Borde grueso azul: foco actual · relleno azul: descubierto · borde verde: procesado · línea verde: arista del árbol · línea azul: arista examinada.</p></div><div aria-live="polite"><p id="explain"></p><div id="detail" class="scroll"></div></div></div></main>
<script>
const D={"title": "Flood fill: una componente de píxeles", "frames": [{"title": "Convertir píxeles en vértices", "explain": "Cada círculo representa un píxel del color original. Solo unimos vecinos horizontales o verticales. Los espacios sin nodo representan píxeles de otro color. Los nodos 8 y 9 solo se tocan diagonalmente: no son vecinos."}, {"title": "Recolorear píxel 1", "explain": "Procesamos el píxel 1 y encolamos sus vecinos del color original todavía no descubiertos. Solo se expande la mancha que contiene al píxel inicial.", "current": 1, "seen": [1, 2], "done": [1], "detail": "<pre>Cola: [2]\nPíxeles recoloreados: [1]</pre>"}, {"title": "Recolorear píxel 2", "explain": "Procesamos el píxel 2 y encolamos sus vecinos del color original todavía no descubiertos. Solo se expande la mancha que contiene al píxel inicial.", "current": 2, "seen": [1, 2, 3], "done": [1, 2], "detail": "<pre>Cola: [3]\nPíxeles recoloreados: [1, 2]</pre>"}, {"title": "Recolorear píxel 3", "explain": "Procesamos el píxel 3 y encolamos sus vecinos del color original todavía no descubiertos. Solo se expande la mancha que contiene al píxel inicial.", "current": 3, "seen": [1, 2, 3, 4, 6], "done": [1, 2, 3], "detail": "<pre>Cola: [4, 6]\nPíxeles recoloreados: [1, 2, 3]</pre>"}, {"title": "Recolorear píxel 4", "explain": "Procesamos el píxel 4 y encolamos sus vecinos del color original todavía no descubiertos. Solo se expande la mancha que contiene al píxel inicial.", "current": 4, "seen": [1, 2, 3, 4, 6], "done": [1, 2, 3, 4], "detail": "<pre>Cola: [6]\nPíxeles recoloreados: [1, 2, 3, 4]</pre>"}, {"title": "Recolorear píxel 6", "explain": "Procesamos el píxel 6 y encolamos sus vecinos del color original todavía no descubiertos. Solo se expande la mancha que contiene al píxel inicial.", "current": 6, "seen": [1, 2, 3, 4, 6, 5, 7], "done": [1, 2, 3, 4, 6], "detail": "<pre>Cola: [5, 7]\nPíxeles recoloreados: [1, 2, 3, 4, 6]</pre>"}, {"title": "Recolorear píxel 5", "explain": "Procesamos el píxel 5 y encolamos sus vecinos del color original todavía no descubiertos. Solo se expande la mancha que contiene al píxel inicial.", "current": 5, "seen": [1, 2, 3, 4, 6, 5, 7], "done": [1, 2, 3, 4, 6, 5], "detail": "<pre>Cola: [7]\nPíxeles recoloreados: [1, 2, 3, 4, 6, 5]</pre>"}, {"title": "Recolorear píxel 7", "explain": "Procesamos el píxel 7 y encolamos sus vecinos del color original todavía no descubiertos. Solo se expande la mancha que contiene al píxel inicial.", "current": 7, "seen": [1, 2, 3, 4, 6, 5, 7, 8], "done": [1, 2, 3, 4, 6, 5, 7], "detail": "<pre>Cola: [8]\nPíxeles recoloreados: [1, 2, 3, 4, 6, 5, 7]</pre>"}, {"title": "Recolorear píxel 8", "explain": "Procesamos el píxel 8 y encolamos sus vecinos del color original todavía no descubiertos. Solo se expande la mancha que contiene al píxel inicial.", "current": 8, "seen": [1, 2, 3, 4, 6, 5, 7, 8], "done": [1, 2, 3, 4, 6, 5, 7, 8], "detail": "<pre>Cola: []\nPíxeles recoloreados: [1, 2, 3, 4, 6, 5, 7, 8]</pre>"}, {"title": "La otra mancha conserva su color", "explain": "Los píxeles 9, 10 y 11 tienen el mismo color original, pero no hay un camino por vecindad de cuatro direcciones desde 1. Flood fill no recolorea todas las coincidencias de color de la imagen.", "done": [1, 2, 3, 4, 6, 5, 7, 8], "seen": [1, 2, 3, 4, 6, 5, 7, 8]}], "pos": {"1": [45, 45], "2": [113, 45], "3": [113, 103], "4": [181, 103], "5": [45, 161], "6": [113, 161], "7": [113, 219], "8": [181, 219], "9": [249, 277], "10": [317, 277], "11": [317, 335]}, "edges": [[1, 2], [2, 3], [3, 4], [3, 6], [5, 6], [6, 7], [7, 8], [9, 10], [10, 11]]};let i=0;const el=id=>document.getElementById(id),key=e=>e.slice().sort((a,b)=>a-b).join('-');
function render(){const f=D.frames[i],pos=f.pos||D.pos,edges=f.edges||D.edges;el('heading').textContent=f.title;el('explain').textContent=f.explain;el('count').textContent=`Paso ${i+1} de ${D.frames.length}`;el('step').value=i;el('jump').value=i;el('prev').disabled=i===0;el('next').disabled=i===D.frames.length-1;el('detail').innerHTML=f.detail||'';const active=(f.active||[]).map(key),tree=(f.tree||[]).map(key);let out='<title>'+f.title+'</title>';for(const e of edges){let a=pos[e[0]],b=pos[e[1]],k=key(e);out+=`<line class="edge ${tree.includes(k)?'tree':''} ${active.includes(k)?'active':''}" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;}for(const [n,p]of Object.entries(pos)){const v=Number(n);out+=`<circle class="node ${(f.seen||[]).includes(v)?'seen':''} ${(f.done||[]).includes(v)?'done':''} ${f.current===v?'current':''}" cx="${p[0]}" cy="${p[1]}" r="19"/><text text-anchor="middle" x="${p[0]}" y="${p[1]+6}">${n}</text>`;if(f.labels&&f.labels[n]!==undefined)out+=`<text text-anchor="middle" x="${p[0]}" y="${p[1]+39}">${f.labels[n]}</text>`;}el('graph').innerHTML=out;}
el('step').max=D.frames.length-1;D.frames.forEach((f,j)=>{const o=document.createElement('option');o.value=j;o.textContent=`${j+1}. ${f.title}`;el('jump').append(o)});el('prev').onclick=()=>{if(i>0)i--;render()};el('next').onclick=()=>{if(i<D.frames.length-1)i++;render()};el('step').oninput=e=>{i=+e.target.value;render()};el('jump').onchange=e=>{i=+e.target.value;render()};render();
</script></html>
