<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Componentes: expandir el conjunto alcanzable</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#171b23);--fg:light-dark(#172333,#edf1f7);--mut:light-dark(#586579,#bbc7d7);--line:light-dark(#a4aebd,#778497);--on:light-dark(#096cba,#76c8ff);--done:light-dark(#187343,#80dca3);--soft:light-dark(#e7f3fc,#193851)}
*{box-sizing:border-box}body{margin:0;padding:20px;font:16px/1.55 system-ui;background:var(--bg);color:var(--fg)}h1{font-size:22px;margin:0 0 14px}h2{font-size:18px;margin:12px 0}button,select,input{font:inherit}button,select{padding:8px 12px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px}button:disabled{opacity:.4}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--on)}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}input{width:100%;accent-color:var(--on)}.grid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(270px,1fr);gap:24px}.diagram{width:100%;max-height:430px}svg text{fill:var(--fg);font:16px system-ui}.edge{stroke:var(--line);stroke-width:2}.edge.active{stroke:var(--on);stroke-width:5}.tree{stroke:var(--done);stroke-width:4}.node{fill:var(--bg);stroke:var(--line);stroke-width:2}.seen{fill:var(--soft);stroke:var(--on)}.current{stroke:var(--on);stroke-width:5}.done{stroke:var(--done);stroke-width:3}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:center;border-bottom:1px solid var(--line);padding:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);padding:10px}p{margin:8px 0}.legend{color:var(--mut);font-size:14px}.scroll{overflow:auto}#explain{min-height:90px}@media(max-width:650px){.grid{grid-template-columns:1fr}body{padding:12px}.diagram{max-height:360px}}
</style><main id="ada"><h1>Componentes: expandir el conjunto alcanzable</h1><div class="controls"><button id="prev">← Anterior</button><button id="next">Siguiente →</button><span id="count"></span></div><label for="step">Ir a un paso</label><input id="step" type="range" min="0" value="0"><label for="jump">Escena: </label><select id="jump" style="max-width:100%"></select><h2 id="heading"></h2><div class="grid"><div><svg class="diagram" id="graph" viewBox="0 0 460 410" role="img" aria-label="Grafo del paso actual"></svg><p class="legend">Borde grueso azul: foco actual · relleno azul: descubierto · borde verde: procesado · línea verde: arista del árbol · línea azul: arista examinada.</p></div><div aria-live="polite"><p id="explain"></p><div id="detail" class="scroll"></div></div></div></main>
<script>
const D={"title": "Componentes: expandir el conjunto alcanzable", "frames": [{"title": "Grafo completo: tres componentes", "explain": "No hay ninguna arista que una los tres grupos. El dibujo representa las componentes de la diapositiva 21."}, {"title": "Empezar R = {1}", "explain": "El origen 1 es alcanzable desde sí mismo sin recorrer aristas.", "seen": [1], "current": 1}, {"title": "Expandir por 1–2", "explain": "1 ya pertenece a R. Como existe 1–2, extendemos un camino conocido y agregamos 2.", "seen": [1, 2], "current": 2, "active": [[1, 2]], "detail": "<pre>R = [1, 2]</pre>"}, {"title": "Expandir por 1–3", "explain": "1 ya pertenece a R. Como existe 1–3, extendemos un camino conocido y agregamos 3.", "seen": [1, 2, 3], "current": 3, "active": [[1, 3]], "detail": "<pre>R = [1, 2, 3]</pre>"}, {"title": "Expandir por 2–4", "explain": "2 ya pertenece a R. Como existe 2–4, extendemos un camino conocido y agregamos 4.", "seen": [1, 2, 3, 4], "current": 4, "active": [[2, 4]], "detail": "<pre>R = [1, 2, 3, 4]</pre>"}, {"title": "Expandir por 2–5", "explain": "2 ya pertenece a R. Como existe 2–5, extendemos un camino conocido y agregamos 5.", "seen": [1, 2, 3, 4, 5], "current": 5, "active": [[2, 5]], "detail": "<pre>R = [1, 2, 3, 4, 5]</pre>"}, {"title": "Expandir por 3–7", "explain": "3 ya pertenece a R. Como existe 3–7, extendemos un camino conocido y agregamos 7.", "seen": [1, 2, 3, 4, 5, 7], "current": 7, "active": [[3, 7]], "detail": "<pre>R = [1, 2, 3, 4, 5, 7]</pre>"}, {"title": "Expandir por 3–8", "explain": "3 ya pertenece a R. Como existe 3–8, extendemos un camino conocido y agregamos 8.", "seen": [1, 2, 3, 4, 5, 7, 8], "current": 8, "active": [[3, 8]], "detail": "<pre>R = [1, 2, 3, 4, 5, 7, 8]</pre>"}, {"title": "Expandir por 5–6", "explain": "5 ya pertenece a R. Como existe 5–6, extendemos un camino conocido y agregamos 6.", "seen": [1, 2, 3, 4, 5, 7, 8, 6], "current": 6, "active": [[5, 6]], "detail": "<pre>R = [1, 2, 3, 4, 5, 6, 7, 8]</pre>"}, {"title": "No queda ninguna arista de salida", "explain": "R = [1, 2, 3, 4, 5, 6, 7, 8] es una componente completa. Los vértices restantes no son alcanzables desde 1.", "seen": [1, 2, 3, 4, 5, 7, 8, 6], "detail": "<pre>Tamaño de la componente: 8</pre>"}, {"title": "Empezar R = {9}", "explain": "El origen 9 es alcanzable desde sí mismo sin recorrer aristas.", "seen": [9], "current": 9}, {"title": "Expandir por 9–10", "explain": "9 ya pertenece a R. Como existe 9–10, extendemos un camino conocido y agregamos 10.", "seen": [9, 10], "current": 10, "active": [[9, 10]], "detail": "<pre>R = [9, 10]</pre>"}, {"title": "No queda ninguna arista de salida", "explain": "R = [9, 10] es una componente completa. Los vértices restantes no son alcanzables desde 9.", "seen": [9, 10], "detail": "<pre>Tamaño de la componente: 2</pre>"}, {"title": "Empezar R = {11}", "explain": "El origen 11 es alcanzable desde sí mismo sin recorrer aristas.", "seen": [11], "current": 11}, {"title": "Expandir por 11–12", "explain": "11 ya pertenece a R. Como existe 11–12, extendemos un camino conocido y agregamos 12.", "seen": [11, 12], "current": 12, "active": [[11, 12]], "detail": "<pre>R = [11, 12]</pre>"}, {"title": "Expandir por 12–13", "explain": "12 ya pertenece a R. Como existe 12–13, extendemos un camino conocido y agregamos 13.", "seen": [11, 12, 13], "current": 13, "active": [[12, 13]], "detail": "<pre>R = [11, 12, 13]</pre>"}, {"title": "No queda ninguna arista de salida", "explain": "R = [11, 12, 13] es una componente completa. Los vértices restantes no son alcanzables desde 11.", "seen": [11, 12, 13], "detail": "<pre>Tamaño de la componente: 3</pre>"}], "pos": {"1": [95, 40], "2": [45, 120], "3": [155, 120], "4": [25, 220], "5": [110, 220], "6": [110, 315], "7": [220, 40], "8": [220, 220], "9": [300, 40], "10": [300, 160], "11": [420, 40], "12": [420, 180], "13": [355, 300]}, "edges": [[1, 2], [1, 3], [2, 3], [2, 4], [2, 5], [3, 5], [3, 7], [3, 8], [4, 5], [5, 6], [7, 8], [9, 10], [11, 12], [12, 13]]};let i=0;const el=id=>document.getElementById(id),key=e=>e.slice().sort((a,b)=>a-b).join('-');
function render(){const f=D.frames[i],pos=f.pos||D.pos,edges=f.edges||D.edges;el('heading').textContent=f.title;el('explain').textContent=f.explain;el('count').textContent=`Paso ${i+1} de ${D.frames.length}`;el('step').value=i;el('jump').value=i;el('prev').disabled=i===0;el('next').disabled=i===D.frames.length-1;el('detail').innerHTML=f.detail||'';const active=(f.active||[]).map(key),tree=(f.tree||[]).map(key);let out='<title>'+f.title+'</title>';for(const e of edges){let a=pos[e[0]],b=pos[e[1]],k=key(e);out+=`<line class="edge ${tree.includes(k)?'tree':''} ${active.includes(k)?'active':''}" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;}for(const [n,p]of Object.entries(pos)){const v=Number(n);out+=`<circle class="node ${(f.seen||[]).includes(v)?'seen':''} ${(f.done||[]).includes(v)?'done':''} ${f.current===v?'current':''}" cx="${p[0]}" cy="${p[1]}" r="19"/><text text-anchor="middle" x="${p[0]}" y="${p[1]+6}">${n}</text>`;if(f.labels&&f.labels[n]!==undefined)out+=`<text text-anchor="middle" x="${p[0]}" y="${p[1]+39}">${f.labels[n]}</text>`;}el('graph').innerHTML=out;}
el('step').max=D.frames.length-1;D.frames.forEach((f,j)=>{const o=document.createElement('option');o.value=j;o.textContent=`${j+1}. ${f.title}`;el('jump').append(o)});el('prev').onclick=()=>{if(i>0)i--;render()};el('next').onclick=()=>{if(i<D.frames.length-1)i++;render()};el('step').oninput=e=>{i=+e.target.value;render()};el('jump').onchange=e=>{i=+e.target.value;render()};render();
</script></html>
