<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caminos y ciclos, un salto a la vez</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#171b23);--fg:light-dark(#172333,#edf1f7);--mut:light-dark(#586579,#bbc7d7);--line:light-dark(#a4aebd,#778497);--on:light-dark(#096cba,#76c8ff);--done:light-dark(#187343,#80dca3);--soft:light-dark(#e7f3fc,#193851)}
*{box-sizing:border-box}body{margin:0;padding:20px;font:16px/1.55 system-ui;background:var(--bg);color:var(--fg)}h1{font-size:22px;margin:0 0 14px}h2{font-size:18px;margin:12px 0}button,select,input{font:inherit}button,select{padding:8px 12px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px}button:disabled{opacity:.4}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--on)}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}input{width:100%;accent-color:var(--on)}.grid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(270px,1fr);gap:24px}.diagram{width:100%;max-height:430px}svg text{fill:var(--fg);font:16px system-ui}.edge{stroke:var(--line);stroke-width:2}.edge.active{stroke:var(--on);stroke-width:5}.tree{stroke:var(--done);stroke-width:4}.node{fill:var(--bg);stroke:var(--line);stroke-width:2}.seen{fill:var(--soft);stroke:var(--on)}.current{stroke:var(--on);stroke-width:5}.done{stroke:var(--done);stroke-width:3}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:center;border-bottom:1px solid var(--line);padding:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);padding:10px}p{margin:8px 0}.legend{color:var(--mut);font-size:14px}.scroll{overflow:auto}#explain{min-height:90px}@media(max-width:650px){.grid{grid-template-columns:1fr}body{padding:12px}.diagram{max-height:360px}}
</style><main id="ada"><h1>Caminos y ciclos, un salto a la vez</h1><div class="controls"><button id="prev">← Anterior</button><button id="next">Siguiente →</button><span id="count"></span></div><label for="step">Ir a un paso</label><input id="step" type="range" min="0" value="0"><label for="jump">Escena: </label><select id="jump" style="max-width:100%"></select><h2 id="heading"></h2><div class="grid"><div><svg class="diagram" id="graph" viewBox="0 0 460 410" role="img" aria-label="Grafo del paso actual"></svg><p class="legend">Borde grueso azul: foco actual · relleno azul: descubierto · borde verde: procesado · línea verde: arista del árbol · línea azul: arista examinada.</p></div><div aria-live="polite"><p id="explain"></p><div id="detail" class="scroll"></div></div></div></main>
<script>
const D={"title": "Caminos y ciclos, un salto a la vez", "frames": [{"title": "Camino simple: 1", "explain": "Se han recorrido 0 aristas. Cada paso debe seguir una arista existente. Contamos saltos, no círculos.", "current": 1, "seen": [1], "active": [], "detail": "<pre>Secuencia: [1]\nLongitud: 0</pre>"}, {"title": "Camino simple: 1 → 2", "explain": "Se han recorrido 1 aristas. Cada paso debe seguir una arista existente. Contamos saltos, no círculos.", "current": 2, "seen": [1, 2], "active": [[1, 2]], "detail": "<pre>Secuencia: [1, 2]\nLongitud: 1</pre>"}, {"title": "Camino simple: 1 → 2 → 4", "explain": "Se han recorrido 2 aristas. Cada paso debe seguir una arista existente. Contamos saltos, no círculos.", "current": 4, "seen": [1, 2, 4], "active": [[1, 2], [2, 4]], "detail": "<pre>Secuencia: [1, 2, 4]\nLongitud: 2</pre>"}, {"title": "Camino simple: 1 → 2 → 4 → 5", "explain": "Se han recorrido 3 aristas. Cada paso debe seguir una arista existente. Contamos saltos, no círculos.", "current": 5, "seen": [1, 2, 4, 5], "active": [[1, 2], [2, 4], [4, 5]], "detail": "<pre>Secuencia: [1, 2, 4, 5]\nLongitud: 3</pre>"}, {"title": "Camino simple: 1 → 2 → 4 → 5 → 6", "explain": "Se han recorrido 4 aristas. Cada paso debe seguir una arista existente. Contamos saltos, no círculos.", "current": 6, "seen": [1, 2, 4, 5, 6], "active": [[1, 2], [2, 4], [4, 5], [5, 6]], "detail": "<pre>Secuencia: [1, 2, 4, 5, 6]\nLongitud: 4</pre>"}, {"title": "Ciclo simple: 1", "explain": "Se han recorrido 0 aristas. Cada paso debe seguir una arista existente. Contamos saltos, no círculos.", "current": 1, "seen": [1], "active": [], "detail": "<pre>Secuencia: [1]\nLongitud: 0</pre>"}, {"title": "Ciclo simple: 1 → 2", "explain": "Se han recorrido 1 aristas. Cada paso debe seguir una arista existente. Contamos saltos, no círculos.", "current": 2, "seen": [1, 2], "active": [[1, 2]], "detail": "<pre>Secuencia: [1, 2]\nLongitud: 1</pre>"}, {"title": "Ciclo simple: 1 → 2 → 4", "explain": "Se han recorrido 2 aristas. Cada paso debe seguir una arista existente. Contamos saltos, no círculos.", "current": 4, "seen": [1, 2, 4], "active": [[1, 2], [2, 4]], "detail": "<pre>Secuencia: [1, 2, 4]\nLongitud: 2</pre>"}, {"title": "Ciclo simple: 1 → 2 → 4 → 5", "explain": "Se han recorrido 3 aristas. Cada paso debe seguir una arista existente. Contamos saltos, no círculos.", "current": 5, "seen": [1, 2, 4, 5], "active": [[1, 2], [2, 4], [4, 5]], "detail": "<pre>Secuencia: [1, 2, 4, 5]\nLongitud: 3</pre>"}, {"title": "Ciclo simple: 1 → 2 → 4 → 5 → 3", "explain": "Se han recorrido 4 aristas. Cada paso debe seguir una arista existente. Contamos saltos, no círculos.", "current": 3, "seen": [1, 2, 4, 5, 3], "active": [[1, 2], [2, 4], [4, 5], [5, 3]], "detail": "<pre>Secuencia: [1, 2, 4, 5, 3]\nLongitud: 4</pre>"}, {"title": "Ciclo simple: 1 → 2 → 4 → 5 → 3 → 1", "explain": "Se han recorrido 5 aristas. Regresamos al origen sin repetir otra etiqueta: hemos cerrado un ciclo de longitud 5.", "current": 1, "seen": [1, 2, 4, 5, 3, 1], "active": [[1, 2], [2, 4], [4, 5], [5, 3], [3, 1]], "detail": "<pre>Secuencia: [1, 2, 4, 5, 3, 1]\nLongitud: 5</pre>"}, {"title": "Intento inválido: 1 → 6", "explain": "No existe la arista 1–6. Que dos vértices estén en la misma componente no significa que sean vecinos.", "seen": [1, 6]}, {"title": "Repetir una arista: 1 → 2 → 1", "explain": "Se usa dos veces la misma arista no dirigida. Con la convención de las diapositivas esto no es un camino permitido ni un ciclo.", "active": [[1, 2]], "seen": [1, 2]}], "pos": {"1": [190, 45], "2": [105, 140], "3": [275, 140], "4": [45, 250], "5": [175, 250], "6": [175, 355], "7": [390, 45], "8": [390, 250]}, "edges": [[1, 2], [1, 3], [2, 3], [2, 4], [2, 5], [3, 5], [3, 7], [3, 8], [4, 5], [5, 6], [7, 8]]};let i=0;const el=id=>document.getElementById(id),key=e=>e.slice().sort((a,b)=>a-b).join('-');
function render(){const f=D.frames[i],pos=f.pos||D.pos,edges=f.edges||D.edges;el('heading').textContent=f.title;el('explain').textContent=f.explain;el('count').textContent=`Paso ${i+1} de ${D.frames.length}`;el('step').value=i;el('jump').value=i;el('prev').disabled=i===0;el('next').disabled=i===D.frames.length-1;el('detail').innerHTML=f.detail||'';const active=(f.active||[]).map(key),tree=(f.tree||[]).map(key);let out='<title>'+f.title+'</title>';for(const e of edges){let a=pos[e[0]],b=pos[e[1]],k=key(e);out+=`<line class="edge ${tree.includes(k)?'tree':''} ${active.includes(k)?'active':''}" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;}for(const [n,p]of Object.entries(pos)){const v=Number(n);out+=`<circle class="node ${(f.seen||[]).includes(v)?'seen':''} ${(f.done||[]).includes(v)?'done':''} ${f.current===v?'current':''}" cx="${p[0]}" cy="${p[1]}" r="19"/><text text-anchor="middle" x="${p[0]}" y="${p[1]+6}">${n}</text>`;if(f.labels&&f.labels[n]!==undefined)out+=`<text text-anchor="middle" x="${p[0]}" y="${p[1]+39}">${f.labels[n]}</text>`;}el('graph').innerHTML=out;}
el('step').max=D.frames.length-1;D.frames.forEach((f,j)=>{const o=document.createElement('option');o.value=j;o.textContent=`${j+1}. ${f.title}`;el('jump').append(o)});el('prev').onclick=()=>{if(i>0)i--;render()};el('next').onclick=()=>{if(i<D.frames.length-1)i++;render()};el('step').oninput=e=>{i=+e.target.value;render()};el('jump').onchange=e=>{i=+e.target.value;render()};render();
</script></html>
