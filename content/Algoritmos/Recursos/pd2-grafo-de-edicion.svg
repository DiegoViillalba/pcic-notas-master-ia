<text x="440" y="107">→ Consume yⱼ: hueco en x.</text><text x="440" y="152">↓ Consume xᵢ: hueco en y.</text><text x="440" y="197">↘ Consume ambas: emparejamiento.</text><text x="440" y="252" class="small">Un camino completo equivale a un alineamiento.</text><text x="440" y="278" class="small">El costo de cada arista es el de su columna.</text></svg>