<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-label="Una fase de Borůvka contrae pares de componentes"><title>Una fase de Borůvka contrae pares de componentes</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#425f9c"/></marker></defs><rect width="100%" height="100%" fill="#fbfcff"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18243a}.title{font-size:22px;font-weight:700}.label{font-size:16px;font-weight:600}.small{font-size:14px}.node{fill:#fff;stroke:#314b79;stroke-width:2.5}.green{stroke:#13815d;stroke-width:5}.blue{stroke:#425f9c;stroke-width:4}.red{stroke:#b5483d;stroke-width:4}.gray{stroke:#99a7bb;stroke-width:2.5}.dash{stroke-dasharray:8 7}</style><text x="430" y="37" class="title" text-anchor="middle">Borůvka: elegir y contraer</text><text x="195" y="78" class="label" text-anchor="middle">Antes: 4 componentes</text><text x="660" y="78" class="label" text-anchor="middle">Después: 2 supervértices</text><line x1="100" y1="165" x2="270" y2="165" class="green"/><line x1="100" y1="165" x2="270" y2="235" class="gray"/><line x1="270" y1="165" x2="270" y2="235" class="gray"/><line x1="100" y1="235" x2="270" y2="235" class="green"/><circle cx="100" cy="165" r="25" class="node" fill="#fff"/><text x="100" y="171" class="label" text-anchor="middle">a</text><circle cx="270" cy="165" r="25" class="node" fill="#fff"/><text x="270" y="171" class="label" text-anchor="middle">b</text><circle cx="100" cy="235" r="25" class="node" fill="#fff"/><text x="100" y="241" class="label" text-anchor="middle">c</text><circle cx="270" cy="235" r="25" class="node" fill="#fff"/><text x="270" y="241" class="label" text-anchor="middle">d</text><text x="185" y="150" class="small" text-anchor="middle">ab = 1</text><text x="185" y="253" class="small" text-anchor="middle">cd = 2</text><line x1="360" y1="195" x2="480" y2="195" class="blue" marker-end="url(#arrow)"/><circle cx="605" cy="165" r="25" class="node" fill="#fff"/><text x="605" y="171" class="label" text-anchor="middle">{a,b}</text><circle cx="760" cy="165" r="25" class="node" fill="#fff"/><text x="760" y="171" class="label" text-anchor="middle">{c,d}</text><line x1="630" y1="165" x2="735" y2="165" class="blue"/><text x="682" y="148" class="small" text-anchor="middle">mínimo 3</text><text x="680" y="265" class="small" text-anchor="middle">Cada nueva componente contiene al menos dos anteriores.</text></svg>