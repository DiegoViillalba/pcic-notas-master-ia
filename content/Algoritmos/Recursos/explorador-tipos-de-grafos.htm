<div id="graph-types-explorer" aria-label="Explorador interactivo de tipos de grafos">
  <style>
    #graph-types-explorer{font:14px/1.4 system-ui,sans-serif;color:#20242b;background:#f7f8fb;border:1px solid #d7dbe4;border-radius:12px;padding:16px;max-width:760px}
    #graph-types-explorer .controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
    #graph-types-explorer button{background:#fff;color:#303642;border:1px solid #c8ceda;border-radius:8px;padding:7px 10px;cursor:pointer}
    #graph-types-explorer button[aria-pressed="true"]{background:#4457c4;color:#fff;border-color:#4457c4}
    #graph-types-explorer svg{width:100%;height:auto;background:#fff;border:1px solid #d7dbe4;border-radius:10px}
    #graph-types-explorer line,#graph-types-explorer path.edge{stroke:#667085;stroke-width:2;fill:none}
    #graph-types-explorer circle{fill:#eef0ff;stroke:#4457c4;stroke-width:2}
    #graph-types-explorer text{fill:#20242b;font-weight:600;text-anchor:middle;dominant-baseline:middle}
    #graph-types-explorer .weight{fill:#a33b20;font-size:12px}
    #graph-types-explorer .detail{margin-top:10px;min-height:2.8em}
    @media (prefers-color-scheme:dark){#graph-types-explorer{color:#e7e9ee;background:#1d2027;border-color:#444a57}#graph-types-explorer button{background:#292d36;color:#e7e9ee;border-color:#515866}#graph-types-explorer svg{background:#242832;border-color:#444a57}#graph-types-explorer text{fill:#f0f1f5}#graph-types-explorer circle{fill:#30375b;stroke:#9ba7ff}#graph-types-explorer line,#graph-types-explorer path.edge{stroke:#aeb5c1}#graph-types-explorer .weight{fill:#ffad91}}
  </style>
  <div class="controls" role="group" aria-label="Tipo de grafo">
    <button type="button" data-type="undirected" aria-pressed="true">No dirigido</button>
    <button type="button" data-type="directed" aria-pressed="false">Dirigido</button>
    <button type="button" data-type="weighted" aria-pressed="false">Ponderado</button>
    <button type="button" data-type="disconnected" aria-pressed="false">Desconexo</button>
    <button type="button" data-type="bipartite" aria-pressed="false">Bipartito</button>
    <button type="button" data-type="tree" aria-pressed="false">Árbol</button>
  </div>
  <svg viewBox="0 0 620 300" role="img" aria-labelledby="graph-title graph-desc">
    <title id="graph-title">Grafo no dirigido</title><desc id="graph-desc">Cuatro nodos conectados mediante aristas sin orientación.</desc>
    <defs><marker id="gte-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#667085"/></marker></defs>
    <g class="edges"></g><g class="nodes"></g>
  </svg>
  <div class="detail" aria-live="polite"><strong>No dirigido:</strong> las conexiones son recíprocas; A—B equivale a B—A.</div>
  <script>
  (()=>{
    const root=document.getElementById('graph-types-explorer'), svg=root.querySelector('svg'), edges=svg.querySelector('.edges'), nodes=svg.querySelector('.nodes'), detail=root.querySelector('.detail');
    const sets={
      undirected:{title:'Grafo no dirigido',desc:'Cuatro nodos conectados mediante aristas sin orientación.',note:'<strong>No dirigido:</strong> las conexiones son recíprocas; A—B equivale a B—A.',nodes:[['A',120,90],['B',310,55],['C',490,105],['D',300,235]],edges:[[0,1],[1,2],[2,3],[3,0],[1,3]]},
      directed:{title:'Grafo dirigido',desc:'Cuatro nodos unidos por flechas que indican el sentido de cada relación.',note:'<strong>Dirigido:</strong> A→B no implica B→A; importa el sentido de la flecha.',nodes:[['A',120,90],['B',310,55],['C',490,105],['D',300,235]],edges:[[0,1],[1,2],[2,3],[3,0],[1,3]],directed:true},
      weighted:{title:'Grafo ponderado',desc:'Las aristas muestran pesos numéricos.',note:'<strong>Ponderado:</strong> cada arista tiene un costo; un camino corto en aristas no siempre es el más barato.',nodes:[['A',120,90],['B',310,55],['C',490,105],['D',300,235]],edges:[[0,1,4],[1,2,2],[2,3,7],[3,0,3],[1,3,1]]},
      disconnected:{title:'Grafo desconexo',desc:'Dos componentes no tienen ningún camino entre sí.',note:'<strong>Desconexo:</strong> {A,B,C} y {D,E} forman componentes separadas.',nodes:[['A',100,90],['B',245,65],['C',175,210],['D',440,90],['E',520,210]],edges:[[0,1],[1,2],[2,0],[3,4]]},
      bipartite:{title:'Grafo bipartito',desc:'Las aristas conectan nodos de dos grupos, sin conexiones dentro de un mismo grupo.',note:'<strong>Bipartito:</strong> cada arista une un nodo del grupo izquierdo con uno del derecho.',nodes:[['A',150,65],['B',150,150],['C',150,235],['1',470,85],['2',470,190]],edges:[[0,3],[1,3],[1,4],[2,4]]},
      tree:{title:'Árbol',desc:'Grafo conexo y sin ciclos con cinco nodos.',note:'<strong>Árbol:</strong> es conexo y acíclico; entre cada par de nodos existe un único camino.',nodes:[['A',310,45],['B',180,140],['C',440,140],['D',110,240],['E',245,240]],edges:[[0,1],[0,2],[1,3],[1,4]]}
    };
    const line=(x1,y1,x2,y2,directed)=>{const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),pad=directed?27:24;return `<line x1="${x1+dx/len*24}" y1="${y1+dy/len*24}" x2="${x2-dx/len*pad}" y2="${y2-dy/len*pad}" ${directed?'marker-end="url(#gte-arrow)"':''}/>`};
    function draw(key){const g=sets[key];edges.innerHTML=g.edges.map(e=>{const a=g.nodes[e[0]],b=g.nodes[e[1]],base=line(a[1],a[2],b[1],b[2],g.directed);if(e[2]===undefined)return base;return base+`<text class="weight" x="${(a[1]+b[1])/2+10}" y="${(a[2]+b[2])/2-8}">${e[2]}</text>`}).join('');nodes.innerHTML=g.nodes.map(n=>`<g><circle cx="${n[1]}" cy="${n[2]}" r="23"/><text x="${n[1]}" y="${n[2]}">${n[0]}</text></g>`).join('');svg.querySelector('title').textContent=g.title;svg.querySelector('desc').textContent=g.desc;detail.innerHTML=g.note;root.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.type===key)))}
    root.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>draw(b.dataset.type)));draw('undirected');
  })();
  </script>
</div>
