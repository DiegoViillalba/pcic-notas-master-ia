<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Familias de complejidad</title>
<style>
:root{color-scheme:light dark;--bg:#f7f8fc;--panel:#fff;--ink:#202536;--muted:#667085;--line:#c7cddd;--blue:#2563eb;--blue-soft:#dbeafe;--green:#16834a;--amber:#b76b08;--track:#e5e9f2}
*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:920px;margin:auto}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}h2{margin:0 0 3px;font-size:21px}.subtitle{margin:0;color:var(--muted)}.control{min-width:min(100%,320px)}.control label{display:flex;justify-content:space-between;font-weight:700}.control output{color:var(--blue);font-variant-numeric:tabular-nums}.control input{width:100%}.axis{display:flex;justify-content:space-between;margin:14px 0 4px;padding-left:210px;color:var(--muted);font-size:12px}.families{display:grid;gap:5px}.family{display:grid;grid-template-columns:82px 115px minmax(110px,1fr);gap:10px;align-items:center;width:100%;min-height:42px;padding:5px 7px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--ink);text-align:left;cursor:pointer}.family:hover{background:var(--panel)}.family[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}.name{font-weight:800}.example{color:var(--muted)}.bararea{display:grid;grid-template-columns:minmax(80px,1fr) 112px;gap:9px;align-items:center}.track{height:12px;border-radius:8px;background:var(--track);overflow:hidden}.bar{height:100%;min-width:4px;border-radius:8px;background:var(--blue);transition:width .25s ease}.count{text-align:right;font-variant-numeric:tabular-nums}.detail{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}.detail .formula{color:var(--green);font-size:22px;font-weight:800}.detail h3{margin:0 0 4px;font-size:16px}.detail p{margin:0}.note{margin-top:8px;color:var(--muted);font-size:12px}
@media(max-width:680px){body{padding:12px}.axis{display:none}.family{grid-template-columns:65px minmax(90px,.7fr) minmax(130px,1.3fr);gap:6px}.bararea{grid-template-columns:1fr}.count{text-align:left;font-size:12px}.detail{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.bar{transition:none}}
@media(prefers-color-scheme:dark){:root{--bg:#1f232c;--panel:#292e39;--ink:#f0f2f7;--muted:#b5bdcd;--line:#596274;--blue:#7fb1ff;--blue-soft:#28496f;--green:#75d99b;--amber:#f1be62;--track:#3b4250}}
</style>
<main id="growth-families">
  <div class="top">
    <div><h2>Qué ocurre cuando crece n</h2><p class="subtitle">Las barras usan escala logarítmica para que todas sean visibles.</p></div>
    <div class="control"><label for="size">Tamaño de entrada <output id="size-value">n = 16</output></label><input id="size" type="range" min="4" max="50" value="16" step="1"></div>
  </div>
  <div class="axis"><span>menos operaciones</span><span>más operaciones</span></div>
  <div class="families" id="families" role="group" aria-label="Familias de crecimiento"></div>
  <section class="detail" aria-live="polite"><div class="formula" id="formula"></div><div><h3 id="detail-title"></h3><p id="detail-text"></p></div></section>
  <p class="note">Los conteos ilustran el orden de crecimiento; constantes, hardware y tamaños reales también importan.</p>
</main>
<script>
const defs=[
 {id:'one',name:'O(1)',example:'acceso A[i]',calc:n=>1,log:n=>0,title:'Constante',text:'El trabajo está acotado por una constante que no depende del tamaño de la entrada.'},
 {id:'log',name:'O(log n)',example:'búsqueda binaria',calc:n=>Math.ceil(Math.log2(n)),log:n=>Math.log10(Math.max(1,Math.log2(n))),title:'Logarítmica',text:'Cada paso elimina una fracción constante de los candidatos; duplicar n agrega aproximadamente un paso.'},
 {id:'linear',name:'O(n)',example:'mezclar listas',calc:n=>n,log:n=>Math.log10(n),title:'Lineal',text:'Cada elemento se procesa un número constante de veces.'},
 {id:'nlogn',name:'O(n log n)',example:'mergesort',calc:n=>Math.ceil(n*Math.log2(n)),log:n=>Math.log10(n*Math.log2(n)),title:'Lineal-logarítmica',text:'Hay log n niveles y cada nivel realiza trabajo lineal.'},
 {id:'square',name:'O(n²)',example:'todos los pares',calc:n=>n*n,log:n=>2*Math.log10(n),title:'Cuadrática',text:'Aparecen dos decisiones independientes de tamaño n, como enumerar pares.'},
 {id:'cube',name:'O(n³)',example:'3-SUM directo',calc:n=>n*n*n,log:n=>3*Math.log10(n),title:'Cúbica',text:'Enumerar ternas produce aproximadamente n³ combinaciones.'},
 {id:'exp',name:'O(2ⁿ)',example:'todos los subconjuntos',calc:n=>2**n,log:n=>n*Math.log10(2),title:'Exponencial',text:'Cada elemento duplica el espacio de posibilidades. El crecimiento termina dominando a cualquier polinomio.'},
 {id:'fact',name:'O(n!)',example:'permutaciones TSP',calc:n=>{let v=1;for(let i=2;i<=n;i++)v*=i;return v},log:n=>{let v=0;for(let i=2;i<=n;i++)v+=Math.log10(i);return v},title:'Factorial',text:'Se considera cada orden posible. Incluso frente a 2ⁿ, el crecimiento factorial es mucho mayor.'}
];
const root=document.getElementById('growth-families'),list=document.getElementById('families'),slider=document.getElementById('size'),sizeValue=document.getElementById('size-value'),formula=document.getElementById('formula'),detailTitle=document.getElementById('detail-title'),detailText=document.getElementById('detail-text');let selected='log';
function format(v){if(v<1e6)return new Intl.NumberFormat('es-MX',{maximumFractionDigits:0}).format(v);return v.toExponential(2).replace('e+',' × 10^')}
function draw(){const n=Number(slider.value),maxLog=defs.at(-1).log(n);sizeValue.textContent=`n = ${n}`;list.innerHTML=defs.map(d=>{const width=4+92*(d.log(n)/Math.max(1,maxLog)),value=d.calc(n);return `<button type="button" class="family" data-id="${d.id}" aria-pressed="${d.id===selected}"><span class="name">${d.name}</span><span class="example">${d.example}</span><span class="bararea"><span class="track"><span class="bar" style="display:block;width:${width}%"></span></span><span class="count">${format(value)}</span></span></button>`}).join('');const d=defs.find(x=>x.id===selected);formula.textContent=d.name;detailTitle.textContent=d.title;detailText.textContent=d.text}
slider.addEventListener('input',draw);list.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;selected=b.dataset.id;draw()});draw();
</script>
</html>
