/><circle cx="138" cy="253" r="3" fill="#718294"/><circle cx="204" cy="253" r="3" fill="#718294"/><circle cx="270" cy="253" r="3" fill="#718294"/><circle cx="336" cy="253" r="3" fill="#718294"/><circle cx="402" cy="253" r="3" fill="#718294"/><circle cx="468" cy="253" r="3" fill="#718294"/><circle cx="72" cy="286" r="3" fill="#718294"/><circle cx="138" cy="286" r="3" fill="#718294"/><circle cx="204" cy="286" r="3" fill="#718294"/><circle cx="270" cy="286" r="3" fill="#718294"/><circle cx="336" cy="286" r="3" fill="#718294"/><circle cx="402" cy="286" r="3" fill="#718294"/><circle cx="468" cy="286" r="3" fill="#718294"/><circle cx="72" cy="319" r="3" fill="#718294"/><circle cx="138" cy="319" r="3" fill="#718294"/><circle cx="204" cy="319" r="3" fill="#718294"/><circle cx="270" cy="319" r="3" fill="#718294"/><circle cx="336" cy="319" r="3" fill="#718294"/><circle cx="402" cy="319" r="3" fill="#718294"/><circle cx="468" cy="319" r="3" fill="#718294"/><text x="72" y="65" text-anchor="middle">ε</text><text x="138" y="65" text-anchor="middle">P</text><text x="204" y="65" text-anchor="middle">A</text><text x="270" y="65" text-anchor="middle">L</text><text x="336" y="65" text-anchor="middle">A</text><text x="402" y="65" text-anchor="middle">T</text><text x="468" y="65" text-anchor="middle">E</text><text x="35" y="93">ε</text><text x="35" y="126">P</text><text x="35" y="159">A</text><text x="35" y="192">L</text><text x="35" y="225">E</text><text x="35" y="258">T</text><text x="35" y="291">T</text><text x="35" y="324">E</text><polyline points="72,88 138,121 204,154 270,187 336,220 336,253 402,286 468,319" fill="none" stroke="#145ea8" stroke-width="4"/><circle cx="270" cy="187" r="8" fill="#9d3237"/><text x="530" y="104">j* = 3; q = 3</text><text x="530" y="144">F[3] = 0; G[3] = 3</text><text x="530" y="184">F[3] + G[3] = 3</text><text x="530" y="236">Izquierda: PAL / PAL</text><text x="530" y="270">Derecha: ETTE / ATE</text><text x="26" y="365" class="small">Todo camino cruza la columna media. El menor F[i] + G[i] identifica un cruce óptimo.</text><text x="26" y="391" class="small">q = 4 también minimiza. Se elige q = 3 para fijar un criterio de desempate.</text></svg>