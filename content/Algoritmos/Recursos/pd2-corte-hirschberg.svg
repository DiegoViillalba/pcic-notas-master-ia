<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" role="img" aria-labelledby="title desc">
<title id="title">Corte óptimo de PALETTE y PALATE</title><desc id="desc">La columna tres se cruza en la fila tres. Los subproblemas son PAL con PAL y ETTE con ATE; el costo total es tres.</desc>
