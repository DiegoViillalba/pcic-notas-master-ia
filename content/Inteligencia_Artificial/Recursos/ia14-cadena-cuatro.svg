<svg xmlns="http://www.w3.org/2000/svg" width="840" height="553" viewBox="0 0 840 553" role="img" aria-labelledby="t d">
<title id="t">Padres y conexiones indirectas</title>
<desc id="d">Cadena X→Y→Z→W.</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#55626e"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1f9d55"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#d64545"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7b4fb8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:#26333d;text-anchor:middle}.ttl{font-size:23px;font-weight:700}.sub{font-size:18px;font-weight:600;fill:#41566e}.sym{font-size:24px;font-weight:700}.lab{font-size:16px;fill:#4a5560;paint-order:stroke;stroke:#fbfaf6;stroke-width:6px;stroke-linejoin:round}.badge{font-size:13px;font-weight:700}.chip{font-size:14px;fill:#41566e}.verd{font-size:15px;font-weight:700}.note{font-size:15px;fill:#4a5560}.foot{font-size:17px;fill:#26333d}.leg{font-size:14px;fill:#4a5560;text-anchor:start}</style>
<rect x="1" y="1" width="838" height="551" rx="14" fill="#fbfaf6" stroke="#d8d4c8" stroke-width="2"/>
<text class="ttl" x="420.0" y="38">Padres y conexiones indirectas</text>
<text class="sub" x="420.0" y="84">Sin evidencia</text>
<line x1="163.0" y1="138.0" x2="293.0" y2="138.0" stroke="#1f9d55" stroke-width="3.2" marker-end="url(#a1)"/>
<line x1="363.0" y1="138.0" x2="493.0" y2="138.0" stroke="#1f9d55" stroke-width="3.2" marker-end="url(#a1)"/>
<line x1="563.0" y1="138.0" x2="693.0" y2="138.0" stroke="#1f9d55" stroke-width="3.2" marker-end="url(#a1)"/>
<circle cx="130" cy="138" r="30" fill="#dbe9fb" stroke="#2f6fbd" stroke-width="2.2"/>
<text class="sym" x="130" y="146">X</text>
<text class="lab" x="130" y="188">raíz</text>
<circle cx="330" cy="138" r="30" fill="#ece1fa" stroke="#7b4fb8" stroke-width="2.2"/>
<text class="sym" x="330" y="146">Y</text>
<text class="lab" x="330" y="188">padre de Z</text>
<circle cx="530" cy="138" r="30" fill="#ece1fa" stroke="#7b4fb8" stroke-width="2.2"/>
<text class="sym" x="530" y="146">Z</text>
<text class="lab" x="530" y="188">padre de W</text>
<circle cx="730" cy="138" r="30" fill="#fde5cc" stroke="#d8731a" stroke-width="2.2"/>
<text class="sym" x="730" y="146">W</text>
<text class="lab" x="730" y="188">último nodo</text>
<rect x="257" y="199" width="326" height="30" rx="15" fill="#fbdcdc" stroke="#c93a3a"/><text class="verd" x="420.0" y="219" fill="#c93a3a">Camino activo: no se garantiza X ⊥ W</text>
<line x1="60" y1="251" x2="780" y2="251" stroke="#d8d4c8" stroke-dasharray="2 5"/>
<text class="sub" x="420.0" y="289">Con Z observado</text>
<line x1="163.0" y1="343.0" x2="293.0" y2="343.0" stroke="#d64545" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#a2)"/>
<line x1="363.0" y1="343.0" x2="493.0" y2="343.0" stroke="#d64545" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#a2)"/>
<line x1="563.0" y1="343.0" x2="693.0" y2="343.0" stroke="#d64545" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#a2)"/>
<circle cx="130" cy="343" r="30" fill="#dbe9fb" stroke="#2f6fbd" stroke-width="2.2"/>
<text class="sym" x="130" y="351">X</text>
<text class="lab" x="130" y="393">raíz</text>
<circle cx="330" cy="343" r="30" fill="#ece1fa" stroke="#7b4fb8" stroke-width="2.2"/>
<text class="sym" x="330" y="351">Y</text>
<text class="lab" x="330" y="393">padre de Z</text>
<circle cx="530" cy="343" r="30" fill="#c9efd6" stroke="#1f8a4c" stroke-width="3"/>
<text class="sym" x="530" y="351">Z</text>
<text class="lab" x="530" y="393">padre de W</text>
<text class="badge" x="530" y="413" fill="#1f8a4c">observado</text>
<circle cx="730" cy="343" r="30" fill="#fde5cc" stroke="#d8731a" stroke-width="2.2"/>
<text class="sym" x="730" y="351">W</text>
<text class="lab" x="730" y="393">último nodo</text>
<rect x="295" y="425" width="251" height="30" rx="15" fill="#d7f2e0" stroke="#1f8a4c"/><text class="verd" x="420.0" y="445" fill="#1f8a4c">Camino bloqueado: X ⊥ W | Z</text>
<text class="foot" x="420.0" y="499">P(X,Y,Z,W) = P(X) P(Y|X) P(Z|Y) P(W|Z)</text>
<circle cx="169" cy="527" r="8" fill="#dbe9fb" stroke="#2f6fbd" stroke-width="2"/><text class="leg" x="183" y="532">raíz / causa</text>
<circle cx="302" cy="527" r="8" fill="#ece1fa" stroke="#7b4fb8" stroke-width="2"/><text class="leg" x="316" y="532">intermedio</text>
<circle cx="418" cy="527" r="8" fill="#fde5cc" stroke="#d8731a" stroke-width="2"/><text class="leg" x="432" y="532">efecto</text>
<circle cx="501" cy="527" r="8" fill="#c9efd6" stroke="#1f8a4c" stroke-width="2"/><text class="leg" x="515" y="532">evidencia observada</text>
</svg>
