<svg xmlns="http://www.w3.org/2000/svg" width="840" height="505" viewBox="0 0 840 505" role="img" aria-labelledby="title desc">
<title id="title">Presión → lluvia → tráfico</title><desc id="desc">Cadena X presión baja a Y lluvia a Z tráfico. Sin evidencia puede haber dependencia indirecta. Al observar Y el camino queda bloqueado y X y Z son condicionalmente independientes.</desc>
<style>
:root{color-scheme:light dark;--bg:#f8f7f3;--text:#192a32;--muted:#52626a;--node:#ffffff;--line:#9aaeb7;--accent:#186b80;--soft:#d9edf1;--blocked:#798992}
@media(prefers-color-scheme:dark){:root{--bg:#151e24;--text:#e7eff2;--muted:#b5c4cb;--node:#202d35;--line:#8a9fa9;--accent:#68becb;--soft:#254650;--blocked:#a2b0b6}}
text{font-family:system-ui,-apple-system,sans-serif;fill:var(--text)}
.title{font-size:26px;font-weight:600}.heading{font-size:21px;font-weight:600}.label{font-size:18px}.symbol{font-size:23px;font-weight:600}.caption{font-size:18px;fill:var(--muted)}.status{font-size:19px;font-weight:600}.factor{font-size:19px}
.node{fill:var(--node);stroke:var(--line);stroke-width:1.5}.observed{fill:var(--soft);stroke:var(--accent);stroke-width:2.5}
.edge{fill:none;stroke:var(--line);stroke-width:2}.active{stroke:var(--accent);stroke-width:2.5}.blocked{stroke:var(--blocked);stroke-dasharray:7 6;stroke-width:2}.separator{stroke:var(--line);stroke-width:1;opacity:.5}
</style>
<defs>
<marker id="arrow-normal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--line)"/></marker>
<marker id="arrow-active" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="arrow-blocked" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--blocked)"/></marker>
</defs>
<rect width="840" height="505" rx="10" fill="var(--bg)"/>
<text x="30" y="42" class="title" text-anchor="start">Presión → lluvia → tráfico</text>
<text x="30" y="83" class="heading" text-anchor="start">Sin conocer la lluvia</text>
<line x1="250.00" y1="150.00" x2="325.00" y2="150.00" class="edge active" marker-end="url(#arrow-active)"/>
<line x1="515.00" y1="150.00" x2="590.00" y2="150.00" class="edge active" marker-end="url(#arrow-active)"/>
<ellipse cx="155" cy="150" rx="95" ry="46" class="node "/>
<text x="155" y="146" class="symbol" text-anchor="middle">X</text>
<text x="155" y="172" class="label" text-anchor="middle">presión baja</text>
<ellipse cx="420" cy="150" rx="95" ry="46" class="node "/>
<text x="420" y="146" class="symbol" text-anchor="middle">Y</text>
<text x="420" y="172" class="label" text-anchor="middle">lluvia</text>
<ellipse cx="685" cy="150" rx="95" ry="46" class="node "/>
<text x="685" y="146" class="symbol" text-anchor="middle">Z</text>
<text x="685" y="172" class="label" text-anchor="middle">tráfico</text>
<text x="420" y="261" class="caption" text-anchor="middle">La presión puede informar sobre tráfico a través de la lluvia.</text>
<text x="30" y="303" class="heading" text-anchor="start">Con la lluvia observada</text>
<line x1="250.00" y1="370.00" x2="325.00" y2="370.00" class="edge blocked" marker-end="url(#arrow-blocked)"/>
<line x1="515.00" y1="370.00" x2="590.00" y2="370.00" class="edge blocked" marker-end="url(#arrow-blocked)"/>
<ellipse cx="155" cy="370" rx="95" ry="46" class="node "/>
<text x="155" y="366" class="symbol" text-anchor="middle">X</text>
<text x="155" y="392" class="label" text-anchor="middle">presión baja</text>
<ellipse cx="420" cy="370" rx="95" ry="46" class="node observed"/>
<text x="420" y="366" class="symbol" text-anchor="middle">Y</text>
<text x="420" y="392" class="label" text-anchor="middle">lluvia</text>
<text x="420" y="443" class="caption" text-anchor="middle">observado</text>
<ellipse cx="685" cy="370" rx="95" ry="46" class="node "/>
<text x="685" y="366" class="symbol" text-anchor="middle">Z</text>
<text x="685" y="392" class="label" text-anchor="middle">tráfico</text>
<text x="420" y="481" class="caption" text-anchor="middle">X ⊥ Z | Y: conocer X ya no añade información sobre Z.</text>
<line x1="30" y1="270" x2="810" y2="270" class="separator"/>
</svg>
