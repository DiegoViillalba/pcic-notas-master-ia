<svg xmlns="http://www.w3.org/2000/svg" width="840" height="459" viewBox="0 0 840 459" role="img" aria-labelledby="t d">
<title id="t">Caries: una causa común, dos observaciones</title>
<desc id="d">C→T y C→K.</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#55626e"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1f9d55"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#d64545"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7b4fb8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:#26333d;text-anchor:middle}.ttl{font-size:23px;font-weight:700}.sub{font-size:18px;font-weight:600;fill:#41566e}.sym{font-size:24px;font-weight:700}.lab{font-size:16px;fill:#4a5560;paint-order:stroke;stroke:#fbfaf6;stroke-width:6px;stroke-linejoin:round}.badge{font-size:13px;font-weight:700}.chip{font-size:14px;fill:#41566e}.verd{font-size:15px;font-weight:700}.note{font-size:15px;fill:#4a5560}.foot{font-size:17px;fill:#26333d}.leg{font-size:14px;fill:#4a5560;text-anchor:start}</style>
<rect x="1" y="1" width="838" height="457" rx="14" fill="#fbfaf6" stroke="#d8d4c8" stroke-width="2"/>
<text class="ttl" x="420.0" y="38">Caries: una causa común, dos observaciones</text>
<line x1="393.8" y1="133.0" x2="279.4" y2="220.5" stroke="#55626e" stroke-width="2.4" marker-end="url(#a0)"/>
<line x1="446.2" y1="133.0" x2="560.6" y2="220.5" stroke="#55626e" stroke-width="2.4" marker-end="url(#a0)"/>
<circle cx="420" cy="113" r="30" fill="#dbe9fb" stroke="#2f6fbd" stroke-width="2.2"/>
<text class="sym" x="420" y="121">C</text>
<text class="lab" x="420" y="163">caries</text>
<circle cx="250" cy="243" r="30" fill="#fde5cc" stroke="#d8731a" stroke-width="2.2"/>
<text class="sym" x="250" y="251">T</text>
<text class="lab" x="250" y="293">dolor dental</text>
<circle cx="590" cy="243" r="30" fill="#fde5cc" stroke="#d8731a" stroke-width="2.2"/>
<text class="sym" x="590" y="251">K</text>
<text class="lab" x="590" y="293">detección</text>
<rect x="328" y="309" width="184" height="30" rx="15" fill="#d7f2e0" stroke="#1f8a4c"/><text class="verd" x="420.0" y="329" fill="#1f8a4c">Supuesto: T ⊥ K | C</text>
<text class="note" x="420.0" y="367">Sin observar C, el dolor y la detección pueden estar relacionados.</text>
<text class="foot" x="420.0" y="405">P(C,T,K) = P(C) P(T|C) P(K|C)</text>
<circle cx="322" cy="433" r="8" fill="#dbe9fb" stroke="#2f6fbd" stroke-width="2"/><text class="leg" x="336" y="438">raíz / causa</text>
