<svg xmlns="http://www.w3.org/2000/svg" width="840" height="328" viewBox="0 0 840 328" role="img" aria-labelledby="t d">
<title id="t">Cadena R → T → L: consulta P(L)</title>
<desc id="d">Consulta L; ocultas R y T.</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#55626e"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1f9d55"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#d64545"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7b4fb8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:#26333d;text-anchor:middle}.ttl{font-size:23px;font-weight:700}.sub{font-size:18px;font-weight:600;fill:#41566e}.sym{font-size:24px;font-weight:700}.lab{font-size:16px;fill:#4a5560;paint-order:stroke;stroke:#fbfaf6;stroke-width:6px;stroke-linejoin:round}.badge{font-size:13px;font-weight:700}.chip{font-size:14px;fill:#41566e}.verd{font-size:15px;font-weight:700}.note{font-size:15px;fill:#4a5560}.foot{font-size:17px;fill:#26333d}.leg{font-size:14px;fill:#4a5560;text-anchor:start}</style>
<rect x="1" y="1" width="838" height="326" rx="14" fill="#fbfaf6" stroke="#d8d4c8" stroke-width="2"/>
<text class="ttl" x="420.0" y="38">Cadena R → T → L: consulta P(L)</text>
<line x1="193.0" y1="118.0" x2="383.0" y2="118.0" stroke="#55626e" stroke-width="2.4" marker-end="url(#a0)"/>
<line x1="453.0" y1="118.0" x2="643.0" y2="118.0" stroke="#55626e" stroke-width="2.4" marker-end="url(#a0)"/>
<circle cx="160" cy="118" r="30" fill="#f1f1ef" stroke="#8a8a85" stroke-width="2.2" stroke-dasharray="6 4"/>
<text class="sym" x="160" y="126">R</text>
<text class="lab" x="160" y="168">lluvia</text>
<circle cx="420" cy="118" r="30" fill="#f1f1ef" stroke="#8a8a85" stroke-width="2.2" stroke-dasharray="6 4"/>
<text class="sym" x="420" y="126">T</text>
<text class="lab" x="420" y="168">tráfico</text>
<circle cx="680" cy="118" r="30" fill="#fbd5d5" stroke="#c93a3a" stroke-width="3"/>
<text class="sym" x="680" y="126">L</text>
<text class="lab" x="680" y="168">llegar tarde</text>
<text class="badge" x="680" y="188" fill="#c93a3a">consulta</text>
<rect x="114" y="61" width="92" height="26" rx="13" fill="#fff" stroke="#b9b5a8"/><text class="chip" x="160" y="79">P(r) = 0.1</text>
<rect x="382" y="61" width="76" height="26" rx="13" fill="#fff" stroke="#b9b5a8"/><text class="chip" x="420" y="79">P(t | R)</text>
<rect x="642" y="61" width="76" height="26" rx="13" fill="#fff" stroke="#b9b5a8"/><text class="chip" x="680" y="79">P(l | T)</text>
<rect x="295" y="200" width="251" height="30" rx="15" fill="#e6ebf2" stroke="#41566e"/><text class="verd" x="420.0" y="220" fill="#41566e">Se suman R y T: ocho mundos</text>
<text class="foot" x="420.0" y="274">P(r,t,l) = P(r) P(t|r) P(l|t)</text>
<circle cx="298" cy="302" r="8" fill="#f1f1ef" stroke="#8a8a85" stroke-width="2" stroke-dasharray="4 3"/><text class="leg" x="312" y="307">oculta (se suma)</text>
<circle cx="463" cy="302" r="8" fill="#fbd5d5" stroke="#c93a3a" stroke-width="2"/><text class="leg" x="477" y="307">consulta</text>
