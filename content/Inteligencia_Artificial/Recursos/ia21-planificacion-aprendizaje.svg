<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 285" role="img" aria-labelledby="title desc">
<title id="title">Del modelo a las muestras</title><desc id="desc">La planificación usa la distribución completa de sucesores. Q-learning usa una transición observada para actualizar una entrada de Q.</desc>
<style>
.bg{fill:#fafbf8} .label,.small,.title{fill:#202d36;font:18px system-ui,sans-serif} .small{font-size:16px} .title{font-size:22px;font-weight:600}
.box{fill:#eef1ec;stroke:#78868c;stroke-width:1.2} .blue{stroke:#185f9b} .orange{stroke:#a34e22} .edge{stroke:#78868c;stroke-width:1.8} .accent{fill:#185f9b} .arrowhead{fill:#78868c}
@media(prefers-color-scheme:dark){.bg{fill:#182128} .label,.small,.title{fill:#ecf0e9} .box{fill:#27333c;stroke:#9baab1} .blue{stroke:#8fc8ff} .orange{stroke:#ffb68b} .edge{stroke:#9baab1} .accent{fill:#8fc8ff} .arrowhead{fill:#9baab1}}
</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" class="arrowhead"/></marker></defs>
<rect class="bg" width="880" height="285" rx="12"/>
<text x="440" y="35" class="title" text-anchor="middle">Misma idea de continuación; distinta información disponible</text><rect x="25" y="83" width="250" height="78" rx="12" class="box "/><text x="150.0" y="113" class="label" text-anchor="middle">Modelo conocido</text><text x="150.0" y="139" class="small" text-anchor="middle">T y R completos</text><line x1="275" y1="123" x2="340" y2="123" class="edge " marker-end="url(#arrow)"/><rect x="350" y="83" width="505" height="78" rx="12" class="box "/><text x="602.5" y="113" class="label" text-anchor="middle">Planificación</text><text x="602.5" y="139" class="small" text-anchor="middle">sumar sobre todos los sucesores: Σ T [R + γ V]</text><rect x="25" y="193" width="250" height="78" rx="12" class="box "/><text x="150.0" y="223" class="label" text-anchor="middle">Experiencia</text><text x="150.0" y="249" class="small" text-anchor="middle">muestra (s, a, r, s′)</text><line x1="275" y1="233" x2="340" y2="233" class="edge " marker-end="url(#arrow)"/><rect x="350" y="193" width="505" height="78" rx="12" class="box "/><text x="602.5" y="223" class="label" text-anchor="middle">Aprendizaje por muestras</text><text x="602.5" y="249" class="small" text-anchor="middle">mover Q(s,a) hacia r + γ max Q(s′, ·)</text></svg>