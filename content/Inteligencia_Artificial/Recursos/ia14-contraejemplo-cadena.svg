<svg xmlns="http://www.w3.org/2000/svg" width="840" height="572" viewBox="0 0 840 572" role="img" aria-labelledby="t d">
<title id="t">La topología no obliga a la dependencia</title>
<desc id="d">X→Y→Z con dos conjuntos de CPT.</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#55626e"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1f9d55"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#d64545"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7b4fb8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:#26333d;text-anchor:middle}.ttl{font-size:23px;font-weight:700}.sub{font-size:18px;font-weight:600;fill:#41566e}.sym{font-size:24px;font-weight:700}.lab{font-size:16px;fill:#4a5560;paint-order:stroke;stroke:#fbfaf6;stroke-width:6px;stroke-linejoin:round}.badge{font-size:13px;font-weight:700}.chip{font-size:14px;fill:#41566e}.verd{font-size:15px;font-weight:700}.note{font-size:15px;fill:#4a5560}.foot{font-size:17px;fill:#26333d}.leg{font-size:14px;fill:#4a5560;text-anchor:start}</style>
<rect x="1" y="1" width="838" height="570" rx="14" fill="#fbfaf6" stroke="#d8d4c8" stroke-width="2"/>
<text class="ttl" x="420.0" y="38">La topología no obliga a la dependencia</text>
<text class="sub" x="420.0" y="84">CPT deterministas: Y = X y Z = Y</text>
<line x1="193.0" y1="138.0" x2="383.0" y2="138.0" stroke="#1f9d55" stroke-width="3.2" marker-end="url(#a1)"/>
<line x1="453.0" y1="138.0" x2="643.0" y2="138.0" stroke="#1f9d55" stroke-width="3.2" marker-end="url(#a1)"/>
<circle cx="160" cy="138" r="30" fill="#dbe9fb" stroke="#2f6fbd" stroke-width="2.2"/>
<text class="sym" x="160" y="146">X</text>
<text class="lab" x="160" y="188">moneda justa</text>
<circle cx="420" cy="138" r="30" fill="#ece1fa" stroke="#7b4fb8" stroke-width="2.2"/>
<text class="sym" x="420" y="146">Y</text>
<circle cx="680" cy="138" r="30" fill="#fde5cc" stroke="#d8731a" stroke-width="2.2"/>
<text class="sym" x="680" y="146">Z</text>
<rect x="248" y="219" width="343" height="30" rx="15" fill="#fbdcdc" stroke="#c93a3a"/><text class="verd" x="420.0" y="239" fill="#c93a3a">Dependientes: P(X=1, Z=1) = 0.5 ≠ 0.25</text>
<line x1="60" y1="271" x2="780" y2="271" stroke="#d8d4c8" stroke-dasharray="2 5"/>
<text class="sub" x="420.0" y="309">Todas las CPT dan 0.5, sin usar a sus padres</text>
<line x1="193.0" y1="363.0" x2="383.0" y2="363.0" stroke="#d64545" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#a2)"/>
<line x1="453.0" y1="363.0" x2="643.0" y2="363.0" stroke="#d64545" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#a2)"/>
<circle cx="160" cy="363" r="30" fill="#dbe9fb" stroke="#2f6fbd" stroke-width="2.2"/>
<text class="sym" x="160" y="371">X</text>
<text class="lab" x="160" y="413">moneda justa</text>
<circle cx="420" cy="363" r="30" fill="#ece1fa" stroke="#7b4fb8" stroke-width="2.2"/>
<text class="sym" x="420" y="371">Y</text>
<circle cx="680" cy="363" r="30" fill="#fde5cc" stroke="#d8731a" stroke-width="2.2"/>
<text class="sym" x="680" y="371">Z</text>
<rect x="181" y="444" width="478" height="30" rx="15" fill="#d7f2e0" stroke="#1f8a4c"/><text class="verd" x="420.0" y="464" fill="#1f8a4c">Independientes: las flechas existen pero no transmiten</text>
<text class="foot" x="420.0" y="518">Ambos modelos respetan la factorización P(X) P(Y|X) P(Z|Y).</text>
<circle cx="264" cy="546" r="8" fill="#dbe9fb" stroke="#2f6fbd" stroke-width="2"/><text class="leg" x="278" y="551">raíz / causa</text>
<circle cx="397" cy="546" r="8" fill="#ece1fa" stroke="#7b4fb8" stroke-width="2"/><text class="leg" x="411" y="551">intermedio</text>
<circle cx="513" cy="546" r="8" fill="#fde5cc" stroke="#d8731a" stroke-width="2"/><text class="leg" x="527" y="551">efecto</text>
</svg>
