<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>
:root{color-scheme:light dark}body{font:15px system-ui;margin:0;padding:16px;background:#f7f8fc;color:#202536}main{max-width:760px;margin:auto}.top,.controls{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}h2{font-size:19px;margin:0}.controls{justify-content:flex-end}button{padding:7px 11px;border:1px solid #aab1c3;border-radius:7px;background:#fff;color:#202536;cursor:pointer}button[aria-pressed=true]{background:#dbeafe;border-color:#2563eb;font-weight:700}button:disabled{opacity:.35}svg{width:100%;margin-top:10px;border:1px solid #c9cedb;border-radius:10px;background:#fff}.edge{stroke:#aab1c3;stroke-width:2}.node circle{stroke-width:3}.node text{text-anchor:middle;dominant-baseline:central;font-weight:700}.future{opacity:.17}.done circle{fill:#e5e7ec;stroke:#9298a8}.front circle{fill:#fef3c7;stroke:#d97706}.current circle{fill:#dbeafe;stroke:#2563eb}.goal circle{fill:#dcfce7;stroke:#16a34a}.status{margin-top:9px;padding:10px 12px;border-left:4px solid #d97706;background:#fff8dc;min-height:46px;line-height:1.4}.queue{font-family:monospace;font-weight:700}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:8px}.dot{display:inline-block;width:9px;height:9px;border:2px solid;border-radius:50%;margin-right:4px;vertical-align:-2px}@media(prefers-color-scheme:dark){body{background:#20232c;color:#eef0f5}svg{background:#292d38;border-color:#535968}.node text{fill:#eef0f5}.done circle{fill:#444955}.status{background:#3a3522}button{background:#292d38;color:#eef0f5}}
</style><main><div class="top"><h2>DFS, BFS e IDS sobre el mismo árbol</h2><div id="modes" class="controls"><button data-mode="dfs">DFS</button><button data-mode="bfs">BFS</button><button data-mode="ids">IDS</button></div></div><svg viewBox="0 0 700 355" aria-label="Recorrido interactivo del árbol A a O"><g id="edges"></g><g id="nodes"></g></svg><div class="legend"><span><i class="dot" style="border-color:#2563eb"></i>Expandido ahora</span><span><i class="dot" style="border-color:#d97706"></i>Frontera</span><span><i class="dot" style="border-color:#9298a8"></i>Ya procesado</span><span><i class="dot" style="border-color:#16a34a"></i>Meta</span></div><div class="top" style="margin-top:9px"><div class="controls"><button id="prev">← Atrás</button><span id="count"></span><button id="next">Siguiente →</button></div></div><div class="status" id="status"></div></main><script>
const pos={A:[350,35],B:[180,115,'A'],C:[520,115,'A'],D:[95,205,'B'],E:[265,205,'B'],F:[435,205,'C'],G:[605,205,'C'],H:[50,305,'D'],I:[140,305,'D'],J:[220,305,'E'],K:[310,305,'E'],L:[390,305,'F'],M:[480,305,'F'],N:[560,305,'G'],O:[650,305,'G']};
const orders={dfs:['A','B','D','H','I','E','J','K','C','F','L','M','G','N','O'],bfs:['A','B','C','D','E','F','G','H','I','J','K','L','M','N','O']};
function states(order,kind){let out=[],front=['A'],done=[];for(const cur of order){front=front.filter(x=>x!==cur);let kids=Object.keys(pos).filter(x=>pos[x][2]===cur);if(kind==='dfs')front=[...kids,...front];else front=[...front,...kids];out.push({cur,front:[...front],done:[...done],text:`Orden acumulado: ${[...done,cur].join(' → ')} · ${kind==='dfs'?'Pila':'Cola'}: [${front.join(', ')}]`});done.push(cur)}return out}
const ids=[{cur:'A',done:[],front:['A'],text:'Límite 0 · orden: A · corte'},{cur:'A',done:[],front:['B','C'],text:'Límite 1 · orden: A, B, C · corte'},{cur:'A',done:[],front:['D','E','F','G'],text:'Límite 2 · se regeneran A, B y C · orden: A, B, D, E, C, F, G · corte'},{cur:'O',done:['A','B','D','H','I','E','J','K','C','F','L','M','G','N'],front:[],goal:'O',text:'Límite 3 · DFS alcanza O. IDS pagó regeneración para conservar poca memoria.'}];
const sets={dfs:states(orders.dfs,'dfs'),bfs:states(orders.bfs,'bfs'),ids};let mode='dfs',i=0;
for(const [id,n] of Object.entries(pos)){if(n[2]){let p=pos[n[2]],l=document.createElementNS('http://www.w3.org/2000/svg','line');Object.entries({x1:p[0],y1:p[1],x2:n[0],y2:n[1],class:'edge'}).forEach(([k,v])=>l.setAttribute(k,v));edges.append(l)}let g=document.createElementNS('http://www.w3.org/2000/svg','g');g.dataset.id=id;g.setAttribute('transform',`translate(${n[0]} ${n[1]})`);g.innerHTML=`<circle r="21"/><text>${id}</text>`;nodes.append(g)}
function draw(){let a=sets[mode],s=a[i];nodes.querySelectorAll('g').forEach(g=>{let id=g.dataset.id,c='node future';if(s.done.includes(id))c='node done';if(s.front.includes(id))c='node front';if(id===s.cur)c='node current';if(id===(s.goal||''))c='node goal';g.setAttribute('class',c)});status.innerHTML=s.text.replace(/\[([^\]]*)\]/g,'<span class="queue">[$1]</span>');count.textContent=`Paso ${i+1}/${a.length}`;prev.disabled=i===0;next.disabled=i===a.length-1;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode))}prev.onclick=()=>{i--;draw()};next.onclick=()=>{i++;draw()};modes.onclick=e=>{if(e.target.dataset.mode){mode=e.target.dataset.mode;i=0;draw()}};draw();
</script></html>
