<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>
:root{color-scheme:light dark}body{font:15px system-ui;margin:0;padding:16px;background:#f7f8fc;color:#202536}main{max-width:760px;margin:auto}.top,.controls{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}h2{font-size:19px;margin:0}.modes{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}button{padding:7px 10px;border:1px solid #aab1c3;border-radius:7px;background:#fff;color:#202536;cursor:pointer}button[aria-pressed=true]{background:#dbeafe;border-color:#2563eb;color:#173b72;font-weight:700}button:disabled{opacity:.35}svg{width:100%;border:1px solid #c9cedb;border-radius:10px;background:#fff}.edge{stroke:#aab1c3;stroke-width:2}.edge-label{fill:#202536;font-size:12px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.node circle{fill:#fff;stroke:#9298a8;stroke-width:3}.node text{text-anchor:middle;dominant-baseline:central;font-size:12px;font-weight:700}.future{opacity:.38}.done circle{fill:#e5e7ec}.front circle{fill:#fef3c7;stroke:#d97706}.current circle{fill:#dbeafe;stroke:#2563eb}.goal circle{fill:#dcfce7;stroke:#16a34a}.status{margin-top:9px;padding:10px 12px;border-left:4px solid #d97706;background:#fff8dc;min-height:48px;line-height:1.45}@media(prefers-color-scheme:dark){body{background:#20232c;color:#eef0f5}svg{background:#292d38;border-color:#535968}.edge-label{fill:#eef0f5;stroke:#292d38}.node text{fill:#eef0f5}.node circle{fill:#292d38}.done circle{fill:#444955}.status{background:#3a3522}button{background:#292d38;color:#eef0f5}button[aria-pressed=true]{background:#254d82;border-color:#78aef5;color:#fff}}
</style><main><div class="top"><h2>Cómo cambia la prioridad informada</h2></div><div id="modes" class="modes"><button data-mode="greedy">Voraz</button><button data-mode="astar">A*: s-a-d-G</button><button data-mode="improve">A*: no aceptar al generar</button><button data-mode="bad">A*: heurística mala</button></div><svg viewBox="0 0 700 340"><g id="edges"></g><g id="nodes"></g></svg><div class="top" style="margin-top:9px"><div class="controls"><button id="prev">← Atrás</button><span id="count"></span><button id="next">Siguiente →</button></div></div><div class="status" id="status"></div></main><script>
const cases={greedy:{nodes:{Arad:[70,170,'h=366'],Zerind:[235,55,'h=374'],Timisoara:[235,170,'h=329'],Sibiu:[235,285,'h=253'],Fagaras:[435,70,'h=178'],Rimnicu:[435,180,'h=193'],Oradea:[435,290,'h=380'],Bucharest:[630,70,'h=0']},edges:[['Arad','Zerind','75'],['Arad','Timisoara','118'],['Arad','Sibiu','140'],['Sibiu','Fagaras','99'],['Sibiu','Rimnicu','80'],['Sibiu','Oradea','151'],['Fagaras','Bucharest','211']],steps:[['Arad',['Sibiu','Timisoara','Zerind'],[],'Frontera por h: Sibiu 253, Timisoara 329, Zerind 374. Voraz elige Sibiu.'],['Sibiu',['Fagaras','Rimnicu','Timisoara','Zerind','Oradea'],['Arad'],'Frontera por h: Fagaras 178, Rimnicu 193, Timisoara 329, Zerind 374, Oradea 380.'],['Fagaras',['Bucharest','Rimnicu','Timisoara','Zerind','Oradea'],['Arad','Sibiu'],'Fagaras genera Bucharest con h=0; será el siguiente nodo extraído.'],['Bucharest',[],['Arad','Sibiu','Fagaras'],'Meta: Arad → Sibiu → Fagaras → Bucharest cuesta 450; no es la ruta óptima de 418.']]},astar:{nodes:{s:[65,170,'h=6'],a:[195,170,'h=5'],b:[345,60,'h=6'],c:[520,60,'h=7'],d:[405,170,'h=2'],e:[315,285,'h=1'],G:[625,170,'h=0']},edges:[['s','a','1'],['a','b','1'],['b','c','1'],['a','d','3'],['a','e','8'],['e','d','1'],['d','G','2']],steps:[['s',['a'],[],'a queda en la frontera con g=1 y f=6.'],['a',['d','b','e'],['s'],'Frontera por f: d=6, b=8, e=10. A* elige d aunque e tiene menor h.'],['d',['G','b','e'],['s','a'],'d genera G con g=f=6; b y e continúan en la frontera.'],['G',[],['s','a','d'],'Solución s → a → d → G; costo 6. La rama b → c existe, pero no fue necesario expandirla.']]},improve:{nodes:{S:[90,170,'h=3'],A:[320,80,'h=2'],B:[320,260,'h=1'],G:[610,170,'h=0']},edges:[['S','A','2'],['S','B','2'],['A','G','2'],['B','G','3']],steps:[['S',['B','A'],[],'f(B)=3 < f(A)=4.'],['B',['A','G'],['S'],'B genera G con costo 5, pero A tiene f=4: no se acepta aún.'],['A',['G'],['S','B'],'A mejora G de 5 a 4.'],['G',[],['S','B','A'],'Meta extraída: S → A → G, costo óptimo 4.']]},bad:{nodes:{S:[90,170,'h=7'],A:[340,80,'h=6'],G:[610,170,'h=0']},edges:[['S','A','1'],['A','G','3'],['S','G','5']],steps:[['S',['G','A'],[],'f(G)=5 < f(A)=7 porque h(A)=6 sobreestima el costo restante real 3.'],['G',[],['S'],'A* extrae G y devuelve costo 5, aunque S → A → G cuesta 4. La heurística no es admisible.']]}};
const edgesEl=document.getElementById('edges'),nodesEl=document.getElementById('nodes'),modesEl=document.getElementById('modes'),prevEl=document.getElementById('prev'),nextEl=document.getElementById('next'),countEl=document.getElementById('count'),statusEl=document.getElementById('status');
let mode='greedy',i=0;function build(){edgesEl.innerHTML='';nodesEl.innerHTML='';let c=cases[mode];for(const [a,b,w] of c.edges){let A=c.nodes[a],B=c.nodes[b],l=document.createElementNS('http://www.w3.org/2000/svg','line');Object.entries({x1:A[0],y1:A[1],x2:B[0],y2:B[1],class:'edge'}).forEach(([k,v])=>l.setAttribute(k,v));edgesEl.append(l);let t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',(A[0]+B[0])/2);t.setAttribute('y',(A[1]+B[1])/2-6);t.setAttribute('text-anchor','middle');t.setAttribute('class','edge-label');t.textContent=w;edgesEl.append(t)}for(const [id,n] of Object.entries(c.nodes)){let g=document.createElementNS('http://www.w3.org/2000/svg','g');g.dataset.id=id;g.setAttribute('transform',`translate(${n[0]} ${n[1]})`);g.innerHTML=`<circle r="31"/><text><tspan x="0" dy="-7">${id}</tspan><tspan x="0" dy="15">${n[2]}</tspan></text>`;nodesEl.append(g)}draw()}function draw(){let c=cases[mode],s=c.steps[i];nodesEl.querySelectorAll('g').forEach(g=>{let id=g.dataset.id,cl='node future';if(s[2].includes(id))cl='node done';if(s[1].includes(id))cl='node front';if(id===s[0])cl='node current';if(id===s[0]&&(id==='G'||id==='Bucharest'))cl='node goal';g.setAttribute('class',cl)});statusEl.innerHTML=s[3];countEl.textContent=`Paso ${i+1}/${c.steps.length}`;prevEl.disabled=i===0;nextEl.disabled=i===c.steps.length-1;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode))}prevEl.onclick=()=>{i--;draw()};nextEl.onclick=()=>{i++;draw()};modesEl.onclick=e=>{if(e.target.dataset.mode){mode=e.target.dataset.mode;i=0;build()}};build();
</script></html>
