<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" role="img" aria-labelledby="title desc">
<title id="title">Aprender al actuar</title><desc id="desc">El agente elige una acción. El entorno produce el siguiente estado y la recompensa, con los que el agente actualiza sus estimaciones.</desc>
<style>
.bg{fill:#fafbf8} .label,.small,.title{fill:#202d36;font:18px system-ui,sans-serif} .small{font-size:16px} .title{font-size:22px;font-weight:600}
.box{fill:#eef1ec;stroke:#78868c;stroke-width:1.2} .blue{stroke:#185f9b} .orange{stroke:#a34e22} .edge{stroke:#78868c;stroke-width:1.8} .accent{fill:#185f9b} .arrowhead{fill:#78868c}
@media(prefers-color-scheme:dark){.bg{fill:#182128} .label,.small,.title{fill:#ecf0e9} .box{fill:#27333c;stroke:#9baab1} .blue{stroke:#8fc8ff} .orange{stroke:#ffb68b} .edge{stroke:#9baab1} .accent{fill:#8fc8ff} .arrowhead{fill:#9baab1}}
</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" class="arrowhead"/></marker></defs>
<rect class="bg" width="880" height="260" rx="12"/>
<text x="440" y="36" class="title" text-anchor="middle">Actuar cambia los datos que observaremos</text><rect x="60" y="96" width="230" height="78" rx="12" class="box "/><text x="175.0" y="126" class="label" text-anchor="middle">Agente</text><text x="175.0" y="152" class="small" text-anchor="middle">política π y estimaciones</text><rect x="590" y="96" width="230" height="78" rx="12" class="box "/><text x="705.0" y="126" class="label" text-anchor="middle">Entorno</text><text x="705.0" y="152" class="small" text-anchor="middle">dinámica T y recompensa R</text><line x1="290" y1="121" x2="590" y2="121" class="edge " marker-end="url(#arrow)"/><text x="440" y="105" class="label" text-anchor="middle">acción Aₜ</text><path d="M590 161 L450 161 L450 222 L175 222 L175 177" class="edge " fill="none" marker-end="url(#arrow)"/><text x="595" y="215" class="small" text-anchor="middle">estado Sₜ₊₁ y recompensa Rₜ₊₁</text><text x="175" y="76" class="small" text-anchor="middle">observa Sₜ</text></svg>