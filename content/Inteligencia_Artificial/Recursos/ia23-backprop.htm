<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Un ciclo de retropropagación</title>
<style>
:root{color-scheme:light dark;--bg:var(--obsidian-bg,light-dark(#fafcfb,#192329));--fg:var(--obsidian-text,light-dark(#243840,#eef3f1));--muted:var(--obsidian-text-muted,light-dark(#50636d,#bdced2));--line:var(--obsidian-border,light-dark(#a6b8bc,#71878c));--soft:var(--obsidian-bg-2,light-dark(#e8f1f0,#273c43));--accent:var(--obsidian-accent,light-dark(#217a78,#85d3c8));--back:light-dark(#a35438,#f0b59a);font-family:var(--obsidian-font,system-ui,sans-serif)}
*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:var(--fg)}main{max-width:940px;margin:auto}h1{font-size:1.25rem;margin:0 0 8px}p{margin:10px 0;line-height:1.5;overflow-wrap:anywhere}.muted{color:var(--muted)}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:14px 0}label{display:grid;gap:5px;max-width:100%}button,select{font:inherit;padding:9px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:5px;min-height:42px;max-width:100%}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.primary{background:var(--fg);color:var(--bg)}svg{display:block;width:100%;overflow:visible}svg text{fill:var(--fg);font-family:inherit;font-size:14px}svg .value{font-variant-numeric:tabular-nums;font-size:16px}svg rect{fill:var(--soft);stroke:var(--line)}svg .active rect{stroke:var(--accent);stroke-width:3}svg .back rect{stroke:var(--back);stroke-width:3}svg line{stroke:var(--line);stroke-width:1.5}svg .bead{fill:var(--accent);transition:transform .6s ease}svg .bead.backward{fill:var(--back)}.readout{border-block:1px solid var(--line);padding:10px 0;min-height:100px}.readout strong{display:block;margin-bottom:6px}.formula{font-family:ui-monospace,monospace;font-size:.95rem;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{padding:8px 5px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}caption{text-align:left;margin:15px 0 6px;font-weight:600}.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.9rem}.dot{display:inline-block;width:9px;height:9px;background:var(--accent);border-radius:50%;margin-right:5px}.dot.back{background:var(--back)}@media(max-width:420px){body{padding:12px}th,td{font-size:.85rem;padding:8px 3px}.controls label{width:100%}select{width:100%}}@media(prefers-reduced-motion:reduce){svg .bead{transition:none}}@media(pointer:coarse){button,select{min-height:44px}}
</style></head><body><main id="bp23">
<h1>Un ejemplo, un ciclo de aprendizaje</h1>
<p class="muted">Red didáctica: una unidad ReLU y una salida sigmoide. x = 2, y = 1; tasa de aprendizaje η = 0.1.</p>
<div class="controls"><label for="scenario">Unidad oculta<select id="scenario"><option value="active">Activa: w₁ = 0.5</option><option value="inactive">Inactiva: w₁ = −0.5</option></select></label><button type="button" id="play" class="primary">Reproducir ciclo</button><button type="button" id="next">Siguiente paso</button><button type="button" id="reset">Reiniciar</button></div>
<p id="step" aria-live="polite"></p>
<svg id="network" role="img" aria-labelledby="net-title net-desc"><title id="net-title">Recorrido del cálculo de la red</title><desc id="net-desc">Seis operaciones conectadas. La señal avanza en forward y vuelve hacia los parámetros durante backward.</desc></svg>
<p class="legend"><span><span class="dot"></span>Forward / actualización</span><span><span class="dot back"></span>Backward</span></p>
<div id="detail" class="readout" aria-live="polite"></div>
<table><caption>Parámetros: todos los gradientes usan los valores anteriores</caption><thead><tr><th scope="col">Parámetro</th><th scope="col">Antes</th><th scope="col">Gradiente</th><th scope="col">Después</th></tr></thead><tbody id="params"></tbody></table>
<p id="result" class="muted"></p>
</main><script>
(()=>{'use strict';const root=document.getElementById('bp23'),el=id=>root.querySelector('#'+id),svg=el('network'),ns='http://www.w3.org/2000/svg',fmt=x=>Number(x).toFixed(6),sigmoid=z=>1/(1+Math.exp(-z)),bce=z=>Math.max(z,0)-z+Math.log1p(Math.exp(-Math.abs(z)));
let step=0,timer=null,positions=[],nodes=[],bead=null;
function calculate(){const w1=el('scenario').value==='active'?0.5:-0.5,b1=.1,w2=-1,b2=.2,x=2,z1=w1*x+b1,h=Math.max(0,z1),z2=w2*h+b2,p=sigmoid(z2),loss=bce(z2),d2=p-1,d1=d2*w2*(z1>0?1:0),g=[d1*x,d1,d2*h,d2],before=[w1,b1,w2,b2],after=before.map((w,i)=>w-.1*g[i]),newz=after[2]*Math.max(0,after[0]*x+after[1])+after[3];return {z1,h,z2,p,loss,d2,d1,g,before,after,newp:sigmoid(newz),newloss:bce(newz),newz};}
function make(tag,attrs,text){const n=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs||{}))n.setAttribute(k,String(v));if(text!==undefined)n.textContent=text;return n;}
function layout(){const width=Math.max(260,svg.clientWidth),vertical=width<660,height=vertical?424:136;svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.replaceChildren(make('title',{id:'net-title'},'Recorrido del cálculo de la red'),make('desc',{id:'net-desc'},'La señal avanza en forward y vuelve durante backward.'));positions=Array.from({length:6},(_,i)=>vertical?{x:width/2,y:34+i*70}:{x:width/12+i*width/6,y:65});
positions.slice(1).forEach((p,i)=>{const prev=positions[i];svg.appendChild(make('line',{x1:prev.x,y1:prev.y,x2:p.x,y2:p.y}));});
const labels=['Entrada x','Afín 1: z₁','ReLU: h','Afín 2: z₂','Sigmoide: p','Pérdida: ℓ'];nodes=positions.map((p,i)=>{const g=make('g',{}),w=vertical?230:width/6-12;g.appendChild(make('rect',{x:p.x-w/2,y:p.y-28,width:w,height:56,rx:5}));g.appendChild(make('text',{x:p.x,y:p.y-6,'text-anchor':'middle'},labels[i]));const val=make('text',{x:p.x,y:p.y+17,'text-anchor':'middle',class:'value'},'');g.appendChild(val);svg.appendChild(g);return {g,val};});bead=make('circle',{r:5,class:'bead'});svg.appendChild(bead);render();}
function render(){const c=calculate(),updated=step===8,values=updated?[2,c.after[0]*2+c.after[1],Math.max(0,c.after[0]*2+c.after[1]),c.newz,c.newp,c.newloss]:[2,c.z1,c.h,c.z2,c.p,c.loss],threshold=[0,1,2,3,3,4];nodes.forEach((node,i)=>{node.val.textContent=step>=threshold[i]?fmt(values[i]):'pendiente';node.g.setAttribute('class','');});
const index=[0,1,2,4,5,3,1,1,5][step],backward=step===5||step===6;if(nodes[index])nodes[index].g.setAttribute('class',backward?'back':'active');if(bead){bead.setAttribute('class','bead'+(backward?' backward':''));bead.style.transform=`translate(${positions[index].x}px,${positions[index].y-33}px)`;}
const messages=[['Preparar la entrada','x = 2; etiqueta y = 1. Aún no calculamos los valores de la red.'],['Forward: primera transformación',`z₁ = w₁x + b₁ = ${fmt(c.z1)}`],['Forward: compuerta ReLU',`h = max(0, z₁) = ${fmt(c.h)}. Derivada local = ${c.z1>0?1:0}.`],['Forward: puntaje y probabilidad',`z₂ = w₂h + b₂ = ${fmt(c.z2)}; p = σ(z₂) = ${fmt(c.p)}`],['Medir la pérdida',`ℓ = −log(p) = ${fmt(c.loss)}. La etiqueta correcta es 1.`],['Backward: capa de salida',`δ₂ = p − y = ${fmt(c.d2)}; ∂ℓ/∂w₂ = δ₂h = ${fmt(c.g[2])}; ∂ℓ/∂b₂ = ${fmt(c.g[3])}`],['Backward: capa oculta',`δ₁ = δ₂w₂ ReLU′(z₁) = ${fmt(c.d1)}; ∂ℓ/∂w₁ = 2δ₁ = ${fmt(c.g[0])}; ∂ℓ/∂b₁ = ${fmt(c.g[1])}`],['Actualizar simultáneamente','θ nueva = θ anterior − 0.1 × gradiente. Los valores del grafo todavía son los del forward anterior.'],['Nuevo forward con los parámetros actualizados',`p nueva = ${fmt(c.newp)}; ℓ nueva = ${fmt(c.newloss)}. Cambio de pérdida = ${fmt(c.newloss-c.loss)}.`]];
el('step').textContent=`Paso ${step+1} de 9 · ${backward?'Backward':step===7?'Optimización':'Forward'}`;el('detail').replaceChildren();const heading=document.createElement('strong');heading.textContent=messages[step][0];const formula=document.createElement('span');formula.className='formula';formula.textContent=messages[step][1];el('detail').append(heading,formula);
el('params').innerHTML=['w₁','b₁','w₂','b₂'].map((name,i)=>`<tr><th scope="row">${name}</th><td>${fmt(c.before[i])}</td><td>${step>=(i<2?6:5)?fmt(c.g[i]):'—'}</td><td>${step>=7?fmt(c.after[i]):'—'}</td></tr>`).join('');el('result').textContent=el('scenario').value==='inactive'?'La ReLU está inactiva para este ejemplo: w₁, b₁ y w₂ no reciben gradiente aquí. b₂ sí puede cambiar.':'La pérdida mide este ejemplo. Su reducción no demuestra generalización.';el('next').disabled=step===8||timer!==null;el('play').textContent=timer!==null?'Pausar':step===8?'Reproducir de nuevo':'Reproducir ciclo';}
function stop(){if(timer!==null){clearInterval(timer);timer=null;}render();}function advance(){if(step<8)step++;if(step===8)stop();else render();}
el('next').addEventListener('click',advance);el('reset').addEventListener('click',()=>{stop();step=0;render();});el('scenario').addEventListener('change',()=>{stop();step=0;render();});el('play').addEventListener('click',()=>{if(timer!==null){stop();return;}if(step===8)step=0;timer=setInterval(advance,1450);render();});new ResizeObserver(layout).observe(svg);layout();window.addEventListener('pagehide',()=>{if(timer!==null)clearInterval(timer);});
})();
</script></body></html>
