<svg xmlns="http://www.w3.org/2000/svg" width="840" height="350" viewBox="0 0 840 350" role="img" aria-labelledby="title desc">
<title id="title">Profundidad: transformar la representación antes de decidir</title>
<desc id="desc">Cuatro etapas: entrada, patrones locales, combinaciones y clase. Los parámetros se aprenden conjuntamente; la interpretación de cada capa es ilustrativa.</desc>
<style>
:root{color-scheme:light dark;--bg:#fafcfb;--fg:#243840;--muted:#50636d;--line:#a6b8bc;--soft:#e8f1f0;--accent:#217a78;--out:#94532c} @media(prefers-color-scheme:dark){:root{--bg:#192329;--fg:#eef3f1;--muted:#bdced2;--line:#71878c;--soft:#273c43;--accent:#85d3c8;--out:#f3b688}}text{font-family:system-ui,sans-serif;fill:var(--fg);font-size:19px} .small{font-size:17px;fill:var(--muted)}.stage{fill:var(--soft)}.edge{stroke:var(--line);stroke-width:2;fill:none}.mark{stroke:var(--accent);stroke-width:4;fill:none;stroke-linecap:round}.arrow{stroke:var(--muted);stroke-width:2;fill:none;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9" fill="var(--muted)"/></marker></defs>
<rect width="840" height="350" fill="var(--bg)" rx="10"/>
<text x="28" y="38" font-size="23">Aprender características útiles para la decisión</text>
