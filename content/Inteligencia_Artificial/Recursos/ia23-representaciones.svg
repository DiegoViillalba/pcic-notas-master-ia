<text class="small" x="111" y="282">Píxeles o datos</text><text class="small" x="315" y="282">Rasgos locales</text><text class="small" x="519" y="282">Rasgos compuestos</text><text class="small" x="727" y="282">Probabilidades</text>
</g>
<g fill="var(--accent)"><rect x="60" y="137" width="27" height="27" opacity=".3"/><rect x="94" y="137" width="27" height="27" opacity=".5"/><rect x="128" y="137" width="27" height="27" opacity=".8"/><rect x="60" y="172" width="27" height="27" opacity=".6"/><rect x="94" y="172" width="27" height="27" opacity=".9"/><rect x="128" y="172" width="27" height="27" opacity=".4"/><rect x="60" y="207" width="27" height="22" opacity=".8"/><rect x="94" y="207" width="27" height="22" opacity=".4"/><rect x="128" y="207" width="27" height="22" opacity=".7"/></g>
