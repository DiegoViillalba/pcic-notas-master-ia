<svg xmlns="http://www.w3.org/2000/svg" width="840" height="600" viewBox="0 0 840 600" role="img" aria-labelledby="title desc">
<title id="title">Red bayesiana de alarma</title><desc id="desc">Robo B y terremoto E apuntan a alarma A. Alarma apunta a las llamadas J y M. Las raíces son independientes antes de observar efectos.</desc>
<style>
:root{color-scheme:light dark;--bg:#f8f7f3;--text:#192a32;--muted:#52626a;--node:#ffffff;--line:#9aaeb7;--accent:#186b80;--soft:#d9edf1;--blocked:#798992}
@media(prefers-color-scheme:dark){:root{--bg:#151e24;--text:#e7eff2;--muted:#b5c4cb;--node:#202d35;--line:#8a9fa9;--accent:#68becb;--soft:#254650;--blocked:#a2b0b6}}
text{font-family:system-ui,-apple-system,sans-serif;fill:var(--text)}
.title{font-size:26px;font-weight:600}.heading{font-size:21px;font-weight:600}.label{font-size:18px}.symbol{font-size:23px;font-weight:600}.caption{font-size:18px;fill:var(--muted)}.status{font-size:19px;font-weight:600}.factor{font-size:19px}
.node{fill:var(--node);stroke:var(--line);stroke-width:1.5}.observed{fill:var(--soft);stroke:var(--accent);stroke-width:2.5}
.edge{fill:none;stroke:var(--line);stroke-width:2}.active{stroke:var(--accent);stroke-width:2.5}.blocked{stroke:var(--blocked);stroke-dasharray:7 6;stroke-width:2}.separator{stroke:var(--line);stroke-width:1;opacity:.5}
</style>
<defs>
<marker id="arrow-normal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--line)"/></marker>
<marker id="arrow-active" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="arrow-blocked" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--blocked)"/></marker>
</defs>
<rect width="840" height="600" rx="10" fill="var(--bg)"/>
<text x="30" y="42" class="title" text-anchor="start">Red bayesiana de alarma</text>
<line x1="273.68" y1="168.69" x2="371.32" y2="246.31" class="edge normal" marker-end="url(#arrow-normal)"/>
<line x1="566.32" y1="168.69" x2="468.68" y2="246.31" class="edge normal" marker-end="url(#arrow-normal)"/>
<line x1="371.32" y1="323.69" x2="273.68" y2="401.31" class="edge normal" marker-end="url(#arrow-normal)"/>
<line x1="468.68" y1="323.69" x2="566.32" y2="401.31" class="edge normal" marker-end="url(#arrow-normal)"/>
<ellipse cx="225" cy="130" rx="90" ry="46" class="node "/>
<text x="225" y="126" class="symbol" text-anchor="middle">B</text>
<text x="225" y="152" class="label" text-anchor="middle">robo</text>
<ellipse cx="615" cy="130" rx="90" ry="46" class="node "/>
<text x="615" y="126" class="symbol" text-anchor="middle">E</text>
<text x="615" y="152" class="label" text-anchor="middle">terremoto</text>
<ellipse cx="420" cy="285" rx="90" ry="46" class="node "/>
<text x="420" y="281" class="symbol" text-anchor="middle">A</text>
<text x="420" y="307" class="label" text-anchor="middle">alarma</text>
<ellipse cx="225" cy="440" rx="90" ry="46" class="node "/>
<text x="225" y="436" class="symbol" text-anchor="middle">J</text>
<text x="225" y="462" class="label" text-anchor="middle">John llama</text>
<ellipse cx="615" cy="440" rx="90" ry="46" class="node "/>
<text x="615" y="436" class="symbol" text-anchor="middle">M</text>
<text x="615" y="462" class="label" text-anchor="middle">Mary llama</text>
<text x="225" y="204" class="caption" text-anchor="middle">P(B)</text>
<text x="615" y="204" class="caption" text-anchor="middle">P(E)</text>
<text x="420" y="359" class="caption" text-anchor="middle">P(A | B,E)</text>
<text x="225" y="514" class="caption" text-anchor="middle">P(J | A)</text>
<text x="615" y="514" class="caption" text-anchor="middle">P(M | A)</text>
<line x1="30" y1="538" x2="810" y2="538" class="separator"/>
<text x="420" y="578" class="factor" text-anchor="middle">P(B,E,A,J,M) = P(B) P(E) P(A|B,E) P(J|A) P(M|A)</text>
</svg>
