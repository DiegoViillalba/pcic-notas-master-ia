<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>
body{font:16px system-ui;margin:0;padding:18px;background:#f7f8fc;color:#202536}main{max-width:720px;margin:auto}h2{font-size:20px;margin:0 0 12px}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}.buttons{display:flex;gap:8px;align-items:center}button{padding:7px 12px;border:1px solid #aab1c3;border-radius:7px;background:white;cursor:pointer}button:disabled{opacity:.35}svg{width:100%;border:1px solid #c9cedb;border-radius:10px;background:white}.edge{stroke:#aab1c3;stroke-width:2}.node circle{stroke-width:4}.node text{text-anchor:middle;dominant-baseline:central;font-weight:700}.hidden{opacity:.18}.done circle{fill:#e5e7ec;stroke:#9298a8}.frontier circle{fill:#fff2b8;stroke:#e0a900}.current circle{fill:#cfe2ff;stroke:#3578d4}.goal circle{fill:#ccf1d6;stroke:#268c45}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:10px 0}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid;margin-right:5px;vertical-align:-2px}.explain{min-height:52px;border-left:4px solid #e0a900;padding:10px 12px;background:#fff9dc;line-height:1.45}.queue{font-family:monospace;font-weight:bold}
@media(prefers-color-scheme:dark){body{background:#20232c;color:#eef0f5}svg{background:#292d38;border-color:#535968}.node text{fill:#eef0f5}.done circle{fill:#444955}.explain{background:#3a3522}button{background:#292d38;color:#eef0f5}}
</style><main><div class="bar"><h2>La frontera, paso a paso</h2><div class="buttons"><button id="prev">← Atrás</button><span id="count"></span><button id="next">Siguiente →</button></div></div><svg viewBox="0 0 700 340" aria-label="Árbol que muestra cómo cambia la frontera"><g id="edges"></g><g id="nodes"></g></svg><div class="legend"><span><i class="dot" style="border-color:#3578d4"></i>Examinando</span><span><i class="dot" style="border-color:#e0a900"></i>Frontera</span><span><i class="dot" style="border-color:#9298a8"></i>Examinado</span><span><i class="dot" style="border-color:#268c45"></i>Meta</span></div><div class="explain" id="text"></div></main><script>
const data={A:[350,45],B:[190,135,'A'],C:[510,135,'A'],D:[105,235,'B'],E:[275,235,'B'],F:[425,235,'C'],G:[595,235,'C'],H:[55,320,'D'],I:[155,320,'D']};
const steps=[
{cur:'A',front:['A'],seen:['A'],done:[],text:'Al inicio solamente conocemos A. Como falta examinarlo, la frontera es [A].'},
{cur:'A',front:['B','C'],seen:['A','B','C'],done:['A'],text:'Examinamos A y descubrimos B y C. La frontera cambia a [B, C].'},
{cur:'B',front:['C','D','E'],seen:['A','B','C','D','E'],done:['A','B'],text:'Sacamos B y agregamos sus hijos D y E. Frontera = [C, D, E].'},
{cur:'C',front:['D','E','F','G'],seen:['A','B','C','D','E','F','G'],done:['A','B','C'],text:'Sacamos C y agregamos F y G. Frontera = [D, E, F, G].'},
{cur:'D',front:['E','F','G','H','I'],seen:Object.keys(data),done:['A','B','C','D'],text:'Sacamos D y descubrimos H e I. Frontera = [E, F, G, H, I].'},
{cur:'G',front:['G','H','I'],seen:Object.keys(data),done:['A','B','C','D','E','F'],goal:'G',text:'Después de E y F examinamos G. ¡Es la meta! H e I seguían en la frontera, pero ya no es necesario explorarlos.'}];
for(const [id,n] of Object.entries(data)){if(n[2]){let p=data[n[2]],l=document.createElementNS('http://www.w3.org/2000/svg','line');for(const [k,v] of Object.entries({x1:p[0],y1:p[1],x2:n[0],y2:n[1],class:'edge'}))l.setAttribute(k,v);edges.append(l)}let g=document.createElementNS('http://www.w3.org/2000/svg','g');g.dataset.id=id;g.setAttribute('transform',`translate(${n[0]} ${n[1]})`);g.innerHTML=`<circle r="25"/><text>${id}</text>`;nodes.append(g)}
let i=0;function draw(){let s=steps[i];document.querySelectorAll('.node').forEach(()=>{});nodes.querySelectorAll('g').forEach(g=>{let id=g.dataset.id,c='node hidden';if(s.done.includes(id))c='node done';if(s.front.includes(id))c='node frontier';if(id===s.cur)c='node current';if(id===s.goal)c='node goal';g.setAttribute('class',c)});count.textContent=`${i+1}/${steps.length}`;text.innerHTML=s.text.replace(/\[([^\]]+)\]/g,'<span class="queue">[$1]</span>');prev.disabled=i===0;next.disabled=i===steps.length-1}prev.onclick=()=>{i--;draw()};next.onclick=()=>{i++;draw()};draw();
</script></html>
