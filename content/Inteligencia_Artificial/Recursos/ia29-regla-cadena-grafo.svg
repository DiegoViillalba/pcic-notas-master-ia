<text class="lab" x="590" y="323">paraguas</text>
<rect x="278" y="333" width="284" height="30" rx="15" fill="#e6ebf2" stroke="#41566e"/><text class="verd" x="420.0" y="353" fill="#41566e">P(r,t,u) = P(r) P(t|r) P(u|r,t)</text>
<line x1="60" y1="385" x2="780" y2="385" stroke="#d8d4c8" stroke-dasharray="2 5"/>
<text class="sub" x="420.0" y="423">Con el supuesto U ⊥ T | R: desaparece la flecha T → U</text>
<line x1="394.2" y1="497.5" x2="279.0" y2="589.0" stroke="#55626e" stroke-width="2.4" marker-end="url(#a0)"/>
