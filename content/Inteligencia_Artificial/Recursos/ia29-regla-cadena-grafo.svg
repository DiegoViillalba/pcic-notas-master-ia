<rect x="1" y="1" width="838" height="774" rx="14" fill="#fbfaf6" stroke="#d8d4c8" stroke-width="2"/>
<text class="ttl" x="420.0" y="38">Regla de la cadena: del grafo completo al supuesto del modelo</text>
<text class="sub" x="420.0" y="84">Sin suponer independencia: todos los padres previos</text>
