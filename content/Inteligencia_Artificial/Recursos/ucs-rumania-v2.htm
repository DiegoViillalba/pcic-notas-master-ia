</style><main><div class="top"><h2>Costo uniforme: Arad → Bucharest</h2><div class="controls"><button id="prev">← Atrás</button><span id="count">Paso 1/14</span><button id="next">Siguiente →</button></div></div><svg viewBox="0 0 700 390" aria-label="Búsqueda de costo uniforme en Rumania"><g id="roads"></g><g id="nodes"></g></svg><div class="legend"><span><i class="dot" style="border-color:#2563eb"></i>Expandido ahora</span><span><i class="dot" style="border-color:#d97706"></i>Frontera</span><span><i class="dot" style="border-color:#9298a8"></i>Ya procesado</span><span><i class="dot" style="border-color:#16a34a"></i>Ruta óptima</span></div><div class="explanation" id="explanation" aria-live="polite">Frontera: [Arad 0]</div></main><script>
const p={Arad:[80,165],Zerind:[80,65],Timisoara:[65,285],Sibiu:[225,150],Oradea:[205,45],Lugoj:[185,330],Rimnicu:[350,185],Fagaras:[370,90],Mehadia:[300,350],Pitesti:[485,210],Craiova:[445,315],Drobeta:[370,360],Bucharest:[620,195]};
const e=[['Arad','Zerind',75,13,0],['Arad','Timisoara',118,15,0],['Arad','Sibiu',140,0,-10],['Zerind','Oradea',71,0,-10],['Oradea','Sibiu',151,14,0],['Timisoara','Lugoj',111,0,-10],['Sibiu','Rimnicu',80,0,-10],['Sibiu','Fagaras',99,0,-10],['Lugoj','Mehadia',70,0,-10],['Rimnicu','Pitesti',97,0,-10],['Rimnicu','Craiova',146,-13,0],['Fagaras','Bucharest',211,0,-10],['Mehadia','Drobeta',75,0,-11],['Drobeta','Craiova',120,0,-10],['Craiova','Pitesti',138,14,0],['Pitesti','Bucharest',101,0,-10]];
const st=[
['Arad',['Arad'],[],'Frontera: [Arad 0]'],['Arad',['Zerind','Timisoara','Sibiu'],['Arad'],'Se generan Zerind 75, Timisoara 118 y Sibiu 140.'],['Zerind',['Timisoara','Sibiu','Oradea'],['Arad','Zerind'],'Menor g: Zerind 75 · frontera: [Timisoara 118, Sibiu 140, Oradea 146]'],['Timisoara',['Sibiu','Oradea','Lugoj'],['Arad','Zerind','Timisoara'],'Menor g: Timisoara 118 · entra Lugoj 229.'],['Sibiu',['Oradea','Rimnicu','Lugoj','Fagaras'],['Arad','Zerind','Timisoara','Sibiu'],'Sibiu 140 genera Rimnicu 220 y Fagaras 239.'],['Oradea',['Rimnicu','Lugoj','Fagaras'],['Arad','Zerind','Timisoara','Sibiu','Oradea'],'Oradea 146 no mejora Sibiu: 297 > 140.'],['Rimnicu',['Lugoj','Fagaras','Pitesti','Craiova'],['Arad','Zerind','Timisoara','Sibiu','Oradea','Rimnicu'],'Rimnicu 220 genera Pitesti 317 y Craiova 366.'],['Lugoj',['Fagaras','Mehadia','Pitesti','Craiova'],['Arad','Zerind','Timisoara','Sibiu','Oradea','Rimnicu','Lugoj'],'Lugoj 229 genera Mehadia 299.'],['Fagaras',['Mehadia','Pitesti','Craiova','Bucharest'],['Arad','Zerind','Timisoara','Sibiu','Oradea','Rimnicu','Lugoj','Fagaras'],'Aparece Bucharest 450, pero no se acepta: hay nodos más baratos.'],['Mehadia',['Pitesti','Craiova','Drobeta','Bucharest'],['Arad','Zerind','Timisoara','Sibiu','Oradea','Rimnicu','Lugoj','Fagaras','Mehadia'],'Mehadia 299 genera Drobeta 374.'],['Pitesti',['Craiova','Drobeta','Bucharest'],['Arad','Zerind','Timisoara','Sibiu','Oradea','Rimnicu','Lugoj','Fagaras','Mehadia','Pitesti'],'Pitesti mejora Bucharest: 450 → 418.'],['Craiova',['Drobeta','Bucharest'],['Arad','Zerind','Timisoara','Sibiu','Oradea','Rimnicu','Lugoj','Fagaras','Mehadia','Pitesti','Craiova'],'Craiova 366 no mejora rutas conocidas.'],['Drobeta',['Bucharest'],Object.keys(p).filter(x=>x!=='Bucharest'),'Drobeta 374 tampoco mejora rutas.'],['Bucharest',[],Object.keys(p),'<b>Meta extraída con prioridad mínima.</b> Ruta óptima: Arad → Sibiu → Rimnicu → Pitesti → Bucharest; costo 418.']];
const roadsEl=document.getElementById('roads'),nodesEl=document.getElementById('nodes'),explanationEl=document.getElementById('explanation'),countEl=document.getElementById('count'),prevEl=document.getElementById('prev'),nextEl=document.getElementById('next');
for(const [a,b,cost,dx,dy] of e){let l=document.createElementNS('http://www.w3.org/2000/svg','line');Object.entries({x1:p[a][0],y1:p[a][1],x2:p[b][0],y2:p[b][1],class:'road',id:`${a}-${b}`}).forEach(([k,v])=>l.setAttribute(k,v));roadsEl.append(l);let t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',(p[a][0]+p[b][0])/2+dx);t.setAttribute('y',(p[a][1]+p[b][1])/2+dy);t.setAttribute('class','cost-label');t.textContent=cost;roadsEl.append(t)}for(const [id,n] of Object.entries(p)){let g=document.createElementNS('http://www.w3.org/2000/svg','g');g.dataset.id=id;g.setAttribute('transform',`translate(${n[0]} ${n[1]})`);g.innerHTML=`<circle r="25"/><text>${id==='Bucharest'?'Bucarest':id}</text>`;nodesEl.append(g)}let i=0;function draw(){let [cur,front,done,txt]=st[i];nodesEl.querySelectorAll('g').forEach(g=>{let id=g.dataset.id,c='node';if(done.includes(id))c+=' done';if(front.includes(id))c+=' front';if(id===cur)c+=' current';if(i===st.length-1&&id==='Bucharest')c='node goal';g.setAttribute('class',c)});roadsEl.querySelectorAll('line').forEach(l=>l.setAttribute('class','road'));if(i===st.length-1)['Arad-Sibiu','Sibiu-Rimnicu','Rimnicu-Pitesti','Pitesti-Bucharest'].forEach(id=>document.getElementById(id).setAttribute('class','road path'));explanationEl.innerHTML=txt;countEl.textContent=`Paso ${i+1}/${st.length}`;prevEl.disabled=i===0;nextEl.disabled=i===st.length-1}prevEl.onclick=()=>{i--;draw()};nextEl.onclick=()=>{i++;draw()};draw();
</script></html>
