<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" role="img" aria-labelledby="title desc">
<title id="title">Causa común: observar el origen bloquea</title>
<desc id="desc">Y apunta a X; Y apunta a Z. El camino X ← Y → Z está activo sin evidencia.
Al observar Y: X ⟂ Z | Y.</desc>
<style>
svg{color-scheme:light dark;--bg:#fafbf9;--ink:#1d3035;--line:#536971;--node:#ffffff;--accent:#146879;--soft:#dceff0;--muted:#53646c}
@media(prefers-color-scheme:dark){svg{--bg:#182228;--ink:#edf3f4;--line:#a9bdc5;--node:#23333c;--accent:#81d2dc;--soft:#264c56;--muted:#bdcbd0}}
.canvas{fill:var(--bg)}text{font-family:system-ui,sans-serif;fill:var(--ink);text-anchor:middle} .heading{font-size:23px;font-weight:600}.label{font-size:18px}.small{font-size:16px;fill:var(--muted)}.symbol{font-size:24px;font-weight:600}.edge{stroke:var(--line);stroke-width:2;fill:none}.node{fill:var(--node);stroke:var(--line);stroke-width:1.7}.observed{fill:var(--soft);stroke:var(--accent);stroke-width:2.5}
</style>
<rect class="canvas" width="700" height="400" rx="12"/>
<text class="heading" x="350" y="36">Causa común: observar el origen bloquea</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--line)"/></marker></defs>
<line class="edge" x1="325.75" y1="120.88" x2="198.04" y2="230.86" marker-end="url(#arrow)"/>
<line class="edge" x1="374.25" y1="120.88" x2="501.96" y2="230.86" marker-end="url(#arrow)"/>
<circle class="node " cx="350" cy="100" r="32"/><text class="symbol" x="350" y="108">Y</text><text class="label" x="397" y="106" style="text-anchor:start">Entrega próxima</text>
<circle class="node " cx="170" cy="255" r="32"/><text class="symbol" x="170" y="263">X</text><text class="label" x="170" y="313" style="text-anchor:middle">Foro activo</text>
<circle class="node " cx="530" cy="255" r="32"/><text class="symbol" x="530" y="263">Z</text><text class="label" x="530" y="313" style="text-anchor:middle">Laboratorio lleno</text>
<text class="small" x="350" y="360">El camino X ← Y → Z está activo sin evidencia.</text>
<text class="small" x="350" y="383">Al observar Y: X ⟂ Z | Y.</text>
</svg>
