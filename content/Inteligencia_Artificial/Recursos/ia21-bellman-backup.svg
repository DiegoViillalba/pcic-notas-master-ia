<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-labelledby="title desc">
<title id="title">Una actualización de Bellman</title><desc id="desc">Desde Cool se comparan Slow y Fast. En Fast se promedian los dos sucesores antes de maximizar entre acciones.</desc>
<style>
.bg{fill:#fafbf8} .label,.small,.title{fill:#202d36;font:18px system-ui,sans-serif} .small{font-size:16px} .title{font-size:22px;font-weight:600}
.box{fill:#eef1ec;stroke:#78868c;stroke-width:1.2} .blue{stroke:#185f9b} .orange{stroke:#a34e22} .edge{stroke:#78868c;stroke-width:1.8} .accent{fill:#185f9b} .arrowhead{fill:#78868c}
@media(prefers-color-scheme:dark){.bg{fill:#182128} .label,.small,.title{fill:#ecf0e9} .box{fill:#27333c;stroke:#9baab1} .blue{stroke:#8fc8ff} .orange{stroke:#ffb68b} .edge{stroke:#9baab1} .accent{fill:#8fc8ff} .arrowhead{fill:#9baab1}}
</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" class="arrowhead"/></marker></defs>
<rect class="bg" width="880" height="400" rx="12"/>
<text x="440" y="34" class="title" text-anchor="middle">Primero promediar el azar; después elegir la acción</text><rect x="320" y="59" width="240" height="62" rx="12" class="box "/><text x="440.0" y="89" class="label" text-anchor="middle">Cool · nodo MAX</text><line x1="345" y1="121" x2="212" y2="162" class="edge " marker-end="url(#arrow)"/><line x1="535" y1="121" x2="668" y2="162" class="edge " marker-end="url(#arrow)"/><rect x="70" y="168" width="290" height="72" rx="12" class="box "/><text x="215.0" y="198" class="label" text-anchor="middle">Slow</text><text x="215.0" y="224" class="small" text-anchor="middle">Q = 1 + γ V(Cool)</text><rect x="520" y="168" width="290" height="72" rx="12" class="box "/><text x="665.0" y="198" class="label" text-anchor="middle">Fast</text><text x="665.0" y="224" class="small" text-anchor="middle">Q = 2 + γ [V(Cool)+V(Warm)] / 2</text><line x1="212" y1="240" x2="212" y2="285" class="edge " marker-end="url(#arrow)"/><line x1="618" y1="240" x2="560" y2="285" class="edge " marker-end="url(#arrow)"/><line x1="722" y1="240" x2="780" y2="285" class="edge " marker-end="url(#arrow)"/><rect x="115" y="290" width="195" height="58" rx="12" class="box "/><text x="212.5" y="320" class="label" text-anchor="middle">Cool · p = 1</text><rect x="465" y="290" width="190" height="58" rx="12" class="box "/><text x="560.0" y="320" class="label" text-anchor="middle">Cool · p = 0.5</text><rect x="685" y="290" width="190" height="58" rx="12" class="box "/><text x="780.0" y="320" class="label" text-anchor="middle">Warm · p = 0.5</text><text x="440" y="380" class="small" text-anchor="middle">Cada V de abajo pertenece al barrido anterior.</text></svg>