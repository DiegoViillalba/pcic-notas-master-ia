<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 238" role="img" aria-labelledby="title desc">
<title id="title">Descomposición del retorno</title><desc id="desc">El retorno suma recompensas sucesivas multiplicadas por 1, gamma, gamma al cuadrado y así sucesivamente.</desc>
<style>
.bg{fill:#fafbf8} .label,.small,.title{fill:#202d36;font:18px system-ui,sans-serif} .small{font-size:16px} .title{font-size:22px;font-weight:600}
.box{fill:#eef1ec;stroke:#78868c;stroke-width:1.2} .blue{stroke:#185f9b} .orange{stroke:#a34e22} .edge{stroke:#78868c;stroke-width:1.8} .accent{fill:#185f9b} .arrowhead{fill:#78868c}
@media(prefers-color-scheme:dark){.bg{fill:#182128} .label,.small,.title{fill:#ecf0e9} .box{fill:#27333c;stroke:#9baab1} .blue{stroke:#8fc8ff} .orange{stroke:#ffb68b} .edge{stroke:#9baab1} .accent{fill:#8fc8ff} .arrowhead{fill:#9baab1}}
</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" class="arrowhead"/></marker></defs>
<rect class="bg" width="880" height="238" rx="12"/>
<text x="440" y="35" class="title" text-anchor="middle">El futuro cuenta, pero pesa menos cuando γ &lt; 1</text><rect x="30" y="75" width="175" height="80" rx="12" class="box "/><text x="117.5" y="105" class="label" text-anchor="middle">Rₜ₊₁</text><text x="117.5" y="131" class="small" text-anchor="middle">peso 1</text><text x="225" y="122" class="label" text-anchor="middle">+</text><rect x="245" y="75" width="175" height="80" rx="12" class="box "/><text x="332.5" y="105" class="label" text-anchor="middle">Rₜ₊₂</text><text x="332.5" y="131" class="small" text-anchor="middle">peso γ</text><text x="440" y="122" class="label" text-anchor="middle">+</text><rect x="460" y="75" width="175" height="80" rx="12" class="box "/><text x="547.5" y="105" class="label" text-anchor="middle">Rₜ₊₃</text><text x="547.5" y="131" class="small" text-anchor="middle">peso γ²</text><text x="655" y="122" class="label" text-anchor="middle">+</text><rect x="675" y="75" width="175" height="80" rx="12" class="box "/><text x="762.5" y="105" class="label" text-anchor="middle">…</text><text x="762.5" y="131" class="small" text-anchor="middle">peso γᵏ</text><text x="440" y="200" class="label" text-anchor="middle">Gₜ = Rₜ₊₁ + γ Gₜ₊₁   ·   recompensa inmediata + continuación descontada</text></svg>