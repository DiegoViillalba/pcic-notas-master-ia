<svg xmlns="http://www.w3.org/2000/svg" width="700" height="495" viewBox="0 0 700 495" role="img" aria-labelledby="title desc">
<title id="title">Efecto común y evidencia descendiente</title>
<desc id="desc">R apunta a T; B apunta a T; T apunta a T′. R → T ← B está bloqueado sin evidencia.
Observar T o T′ abre el colisionador T.</desc>
<style>
svg{color-scheme:light dark;--bg:#fafbf9;--ink:#1d3035;--line:#536971;--node:#ffffff;--accent:#146879;--soft:#dceff0;--muted:#53646c}
@media(prefers-color-scheme:dark){svg{--bg:#182228;--ink:#edf3f4;--line:#a9bdc5;--node:#23333c;--accent:#81d2dc;--soft:#264c56;--muted:#bdcbd0}}
.canvas{fill:var(--bg)}text{font-family:system-ui,sans-serif;fill:var(--ink);text-anchor:middle} .heading{font-size:23px;font-weight:600}.label{font-size:18px}.small{font-size:16px;fill:var(--muted)}.symbol{font-size:24px;font-weight:600}.edge{stroke:var(--line);stroke-width:2;fill:none}.node{fill:var(--node);stroke:var(--line);stroke-width:1.7}.observed{fill:var(--soft);stroke:var(--accent);stroke-width:2.5}
</style>
<rect class="canvas" width="700" height="495" rx="12"/>
<text class="heading" x="350" y="36">Efecto común y evidencia descendiente</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--line)"/></marker></defs>
<line class="edge" x1="205.42" y1="119.44" x2="320.61" y2="207.52" marker-end="url(#arrow)"/>
<line class="edge" x1="494.58" y1="119.44" x2="379.39" y2="207.52" marker-end="url(#arrow)"/>
<line class="edge" x1="350.00" y1="262.00" x2="350.00" y2="328.00" marker-end="url(#arrow)"/>
<circle class="node " cx="180" cy="100" r="32"/><text class="symbol" x="180" y="108">R</text><text class="label" x="227" y="106" style="text-anchor:start">Lluvia</text>
<circle class="node " cx="520" cy="100" r="32"/><text class="symbol" x="520" y="108">B</text><text class="label" x="567" y="106" style="text-anchor:start">Partido</text>
<circle class="node " cx="350" cy="230" r="32"/><text class="symbol" x="350" y="238">T</text><text class="label" x="397" y="236" style="text-anchor:start">Tráfico</text>
<circle class="node " cx="350" cy="365" r="32"/><text class="symbol" x="350" y="373">T′</text><text class="label" x="350" y="423" style="text-anchor:middle">Reporte de tráfico</text>
<text class="small" x="350" y="455">R → T ← B está bloqueado sin evidencia.</text>
<text class="small" x="350" y="478">Observar T o T′ abre el colisionador T.</text>
</svg>
