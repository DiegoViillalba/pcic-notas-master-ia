<text class="foot" x="420.0" y="342">Cada candidato se ajusta con sus parámetros y se puntúa:</text>
<text class="foot" x="420.0" y="366">S(G) = max_θ log P(D | G, θ) − ρ C(G)   (verosimilitud menos complejidad)</text>
