<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-labelledby="t d">
<title id="t">Aprender la estructura: candidatos sobre G, A y R</title>
<desc id="d">Tres DAG candidatos.</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#55626e"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1f9d55"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#d64545"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7b4fb8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:#26333d;text-anchor:middle}.ttl{font-size:23px;font-weight:700}.sub{font-size:18px;font-weight:600;fill:#41566e}.sym{font-size:24px;font-weight:700}.lab{font-size:16px;fill:#4a5560;paint-order:stroke;stroke:#fbfaf6;stroke-width:6px;stroke-linejoin:round}.badge{font-size:13px;font-weight:700}.chip{font-size:14px;fill:#41566e}.verd{font-size:15px;font-weight:700}.note{font-size:15px;fill:#4a5560}.foot{font-size:17px;fill:#26333d}.leg{font-size:14px;fill:#4a5560;text-anchor:start}</style>
<rect x="1" y="1" width="838" height="418" rx="14" fill="#fbfaf6" stroke="#d8d4c8" stroke-width="2"/>
<text class="ttl" x="420.0" y="38">Aprender la estructura: candidatos sobre G, A y R</text>
<text class="sub" x="140.0" y="84">Sin aristas</text>
<circle cx="90" cy="138" r="30" fill="#dbe9fb" stroke="#2f6fbd" stroke-width="2.2"/>
<text class="sym" x="90" y="146">G</text>
<circle cx="190" cy="138" r="30" fill="#dbe9fb" stroke="#2f6fbd" stroke-width="2.2"/>
<text class="sym" x="190" y="146">A</text>
<circle cx="140" cy="248" r="30" fill="#fde5cc" stroke="#d8731a" stroke-width="2.2"/>
<text class="sym" x="140" y="256">R</text>
<text class="sub" x="420.0" y="84">G → R</text>
<line x1="383.7" y1="168.0" x2="404.7" y2="214.3" stroke="#55626e" stroke-width="2.4" marker-end="url(#a0)"/>
<circle cx="370" cy="138" r="30" fill="#dbe9fb" stroke="#2f6fbd" stroke-width="2.2"/>
<text class="sym" x="370" y="146">G</text>
<circle cx="470" cy="138" r="30" fill="#dbe9fb" stroke="#2f6fbd" stroke-width="2.2"/>
<text class="sym" x="470" y="146">A</text>
<circle cx="420" cy="248" r="30" fill="#fde5cc" stroke="#d8731a" stroke-width="2.2"/>
<text class="sym" x="420" y="256">R</text>
<text class="sub" x="700.0" y="84">G → R ← A</text>
<line x1="663.7" y1="168.0" x2="684.7" y2="214.3" stroke="#55626e" stroke-width="2.4" marker-end="url(#a0)"/>
<line x1="736.3" y1="168.0" x2="715.3" y2="214.3" stroke="#55626e" stroke-width="2.4" marker-end="url(#a0)"/>
<circle cx="650" cy="138" r="30" fill="#dbe9fb" stroke="#2f6fbd" stroke-width="2.2"/>
<text class="sym" x="650" y="146">G</text>
<circle cx="750" cy="138" r="30" fill="#dbe9fb" stroke="#2f6fbd" stroke-width="2.2"/>
