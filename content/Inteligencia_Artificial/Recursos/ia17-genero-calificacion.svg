<svg xmlns="http://www.w3.org/2000/svg" width="840" height="632" viewBox="0 0 840 632" role="img" aria-labelledby="t d">
<title id="t">Aprender CPT contando: género y calificación</title>
<desc id="d">G→R y G→R←A.</desc>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#55626e"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#1f9d55"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#d64545"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7b4fb8"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:#26333d;text-anchor:middle}.ttl{font-size:23px;font-weight:700}.sub{font-size:18px;font-weight:600;fill:#41566e}.sym{font-size:24px;font-weight:700}.lab{font-size:16px;fill:#4a5560;paint-order:stroke;stroke:#fbfaf6;stroke-width:6px;stroke-linejoin:round}.badge{font-size:13px;font-weight:700}.chip{font-size:14px;fill:#41566e}.verd{font-size:15px;font-weight:700}.note{font-size:15px;fill:#4a5560}.foot{font-size:17px;fill:#26333d}.leg{font-size:14px;fill:#4a5560;text-anchor:start}</style>
<rect x="1" y="1" width="838" height="630" rx="14" fill="#fbfaf6" stroke="#d8d4c8" stroke-width="2"/>
<text class="ttl" x="420.0" y="38">Aprender CPT contando: género y calificación</text>
<text class="sub" x="420.0" y="84">Un padre: una fila P(R | g) por género</text>
<line x1="293.0" y1="138.0" x2="543.0" y2="138.0" stroke="#55626e" stroke-width="2.4" marker-end="url(#a0)"/>
<circle cx="260" cy="138" r="30" fill="#dbe9fb" stroke="#2f6fbd" stroke-width="2.2"/>
<text class="sym" x="260" y="146">G</text>
<text class="lab" x="260" y="188">género</text>
<circle cx="580" cy="138" r="30" fill="#fde5cc" stroke="#d8731a" stroke-width="2.2"/>
<text class="sym" x="580" y="146">R</text>
<text class="lab" x="580" y="188">calificación</text>
<rect x="248" y="204" width="343" height="30" rx="15" fill="#e6ebf2" stroke="#41566e"/><text class="verd" x="420.0" y="224" fill="#41566e">P(g) = N(g)/N · P(r | g) = N(r,g)/N(g)</text>
<line x1="60" y1="256" x2="780" y2="256" stroke="#d8d4c8" stroke-dasharray="2 5"/>
<text class="sub" x="420.0" y="294">Dos padres: una fila por cada par (g, a), con menos ejemplos por fila</text>
<line x1="219.3" y1="363.3" x2="387.2" y2="450.9" stroke="#55626e" stroke-width="2.4" marker-end="url(#a0)"/>
<line x1="620.7" y1="363.3" x2="452.8" y2="450.9" stroke="#55626e" stroke-width="2.4" marker-end="url(#a0)"/>
<circle cx="190" cy="348" r="30" fill="#dbe9fb" stroke="#2f6fbd" stroke-width="2.2"/>
<text class="sym" x="190" y="356">G</text>
<text class="lab" x="190" y="398">género</text>
<circle cx="650" cy="348" r="30" fill="#dbe9fb" stroke="#2f6fbd" stroke-width="2.2"/>
<text class="sym" x="650" y="356">A</text>
<text class="lab" x="650" y="398">ganó premio</text>
<circle cx="420" cy="468" r="30" fill="#fde5cc" stroke="#d8731a" stroke-width="2.2"/>
<text class="sym" x="420" y="476">R</text>
<text class="lab" x="420" y="518">calificación</text>
<rect x="202" y="528" width="436" height="30" rx="15" fill="#fff0b8" stroke="#8a6d00"/><text class="verd" x="420.0" y="548" fill="#8a6d00">Más filas ⇒ más parámetros y conteos más pequeños</text>
<circle cx="322" cy="606" r="8" fill="#dbe9fb" stroke="#2f6fbd" stroke-width="2"/><text class="leg" x="336" y="611">raíz / causa</text>
<circle cx="455" cy="606" r="8" fill="#fde5cc" stroke="#d8731a" stroke-width="2"/><text class="leg" x="469" y="611">efecto</text>
</svg>
