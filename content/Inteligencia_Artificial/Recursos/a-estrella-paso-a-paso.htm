<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A* paso a paso: g + h</title>
<style>
:root{color-scheme:light dark;--bg:#f7f8fc;--panel:#fff;--ink:#202536;--muted:#657087;--line:#aab1c3;--blue:#2563eb;--blue-bg:#dbeafe;--amber:#d97706;--amber-bg:#fef3c7;--green:#16a34a;--green-bg:#dcfce7;--red:#dc2626;--red-bg:#fee2e2}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,sans-serif}main{max-width:820px;margin:auto}.top,.controls,.modes{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.top{justify-content:space-between}h2{margin:0;font-size:20px}.modes{margin:10px 0}button{border:1px solid var(--line);border-radius:8px;padding:7px 11px;background:var(--panel);color:var(--ink);cursor:pointer}button[aria-pressed=true]{background:var(--blue-bg);border-color:var(--blue);font-weight:700}button:disabled{opacity:.38;cursor:default}.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(250px,.8fr);gap:12px}svg{width:100%;height:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}.edge{stroke:var(--line);stroke-width:3;fill:none}.edge.best{stroke:var(--green);stroke-width:5}.edge.direct{stroke-dasharray:8 6}.edge-label{fill:var(--ink);font-size:14px;font-weight:750;paint-order:stroke;stroke:var(--panel);stroke-width:5px}.node circle{fill:var(--panel);stroke:var(--line);stroke-width:3}.node text{text-anchor:middle;fill:var(--ink);font-size:13px;font-weight:750}.node.frontier circle{fill:var(--amber-bg);stroke:var(--amber)}.node.current circle{fill:var(--blue-bg);stroke:var(--blue)}.node.closed circle{fill:#e5e7eb}.node.goal circle{fill:var(--green-bg);stroke:var(--green)}.side{display:flex;flex-direction:column;gap:9px}.formula,.frontier,.status{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px}.formula{text-align:center;font-size:18px;font-weight:800}.formula span{color:var(--muted);font-size:13px;font-weight:600}.frontier h3{margin:0 0 7px;font-size:14px}.frontier table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.frontier th,.frontier td{padding:4px 5px;text-align:center;border-bottom:1px solid color-mix(in srgb,var(--line) 45%,transparent)}.frontier th{font-size:12px;color:var(--muted)}.frontier tr:first-of-type td{font-weight:800;color:var(--amber)}.status{border-left:4px solid var(--amber);min-height:80px}.result{font-weight:800}.result.good{color:var(--green)}.result.bad{color:var(--red)}.stepbar{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}.counter{min-width:80px;text-align:center;font-weight:700;color:var(--muted)}
@media(max-width:650px){body{padding:10px}.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.status{grid-column:1/-1}}
@media(prefers-color-scheme:dark){:root{--bg:#20232c;--panel:#292d38;--ink:#eef0f5;--muted:#b3bac9;--line:#596173;--blue:#78aef5;--blue-bg:#284b75;--amber:#f2b84b;--amber-bg:#4b3c1d;--green:#63d58a;--green-bg:#28583b;--red:#ff8585;--red-bg:#663838}.node.closed circle{fill:#444955}}
</style>
<main>
  <div class="top"><h2>A*: cómo compiten g(n), h(n) y f(n)</h2></div>
  <div class="modes" id="modes">
    <button type="button" data-mode="bad" aria-pressed="true">Heurística de la diapositiva</button>
    <button type="button" data-mode="good" aria-pressed="false">Heurística admisible</button>
  </div>
  <div class="layout">
    <svg viewBox="0 0 560 330" role="img" aria-label="Grafo con los estados S, A y G">
      <defs><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker></defs>
      <path id="edge-sa" class="edge" d="M118 155 Q250 45 382 145" marker-end="url(#arrow-a)"/>
      <path id="edge-ag" class="edge" d="M420 170 Q465 170 500 170" marker-end="url(#arrow-a)"/>
      <path id="edge-sg" class="edge direct" d="M120 198 Q310 310 500 198" marker-end="url(#arrow-a)"/>
      <text class="edge-label" x="245" y="82">1</text><text class="edge-label" x="462" y="151">3</text><text class="edge-label" x="305" y="286">5</text>
      <g class="node" data-node="S" transform="translate(85 175)"><circle r="37"/><text><tspan x="0" dy="-7">S</tspan><tspan class="h" x="0" dy="18"></tspan></text></g>
      <g class="node" data-node="A" transform="translate(410 165)"><circle r="37"/><text><tspan x="0" dy="-7">A</tspan><tspan class="h" x="0" dy="18"></tspan></text></g>
      <g class="node" data-node="G" transform="translate(525 190)"><circle r="31"/><text><tspan x="0" dy="-7">G</tspan><tspan class="h" x="0" dy="18">h=0</tspan></text></g>
    </svg>
    <div class="side">
      <div class="formula">f(n) = g(n) + h(n)<br><span>prioridad total = recorrido + estimación</span></div>
      <div class="frontier"><h3>Frontera ordenada por f</h3><table><thead><tr><th>Nodo</th><th>g</th><th>h</th><th>f</th></tr></thead><tbody id="frontier-body"></tbody></table><div id="empty">Todavía vacía</div></div>
      <div class="status" id="status" aria-live="polite"></div>
    </div>
  </div>
  <div class="stepbar"><button type="button" id="prev">← Atrás</button><span class="counter" id="counter"></span><button type="button" id="next">Siguiente →</button></div>
</main>
<script>
const modes={
 bad:{h:{S:7,A:6,G:0},steps:[
  {current:'S',frontier:[['S',0,7]],closed:[],text:'Inicio. Solo S está en la frontera: f(S)=0+7=7.'},
  {current:null,frontier:[['G',5,0],['A',1,6]],closed:['S'],text:'Se expande S. G queda con f=5 y A con f=7; A* ordena G antes que A.'},
  {current:'G',frontier:[['A',1,6]],closed:['S'],goal:true,text:'G sale de la frontera y la prueba de meta termina la búsqueda. <span class="result bad">Resultado: costo 5, pero existe costo 4.</span>'}
 ]},
 good:{h:{S:4,A:3,G:0},steps:[
  {current:'S',frontier:[['S',0,4]],closed:[],text:'Inicio con una estimación exacta: f(S)=0+4=4.'},
  {current:null,frontier:[['A',1,3],['G',5,0]],closed:['S'],text:'Se expande S. Ahora f(A)=4 es menor que f(G)=5, así que la ruta prometedora continúa por A.'},
  {current:'A',frontier:[['G',5,0]],closed:['S'],text:'Se extrae A. Al expandirlo aparece un camino a G con g=1+3=4, mejor que el costo 5 conocido.'},
  {current:'G',frontier:[],closed:['S','A'],goal:true,best:true,text:'G se actualiza y sale con f=g=4. <span class="result good">Resultado: ruta óptima S → A → G.</span>'}
 ]}
};
const nodes=[...document.querySelectorAll('[data-node]')],tbody=document.getElementById('frontier-body'),empty=document.getElementById('empty'),status=document.getElementById('status'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next');let mode='bad',index=0;
function draw(){const m=modes[mode],s=m.steps[index];nodes.forEach(g=>{const id=g.dataset.node;g.querySelector('.h').textContent='h='+m.h[id];let c='node';if(s.closed.includes(id))c+=' closed';if(s.frontier.some(r=>r[0]===id))c+=' frontier';if(s.current===id)c+=' current';if(s.goal&&id==='G')c+=' goal';g.setAttribute('class',c)});tbody.innerHTML=s.frontier.map(([n,g,h])=>`<tr><td>${n}</td><td>${g}</td><td>${h}</td><td>${g+h}</td></tr>`).join('');empty.hidden=s.frontier.length>0;status.innerHTML=s.text;counter.textContent=`Paso ${index+1}/${m.steps.length}`;prev.disabled=index===0;next.disabled=index===m.steps.length-1;document.getElementById('edge-sa').classList.toggle('best',!!s.best);document.getElementById('edge-ag').classList.toggle('best',!!s.best);document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)))}
prev.addEventListener('click',()=>{index--;draw()});next.addEventListener('click',()=>{index++;draw()});document.getElementById('modes').addEventListener('click',e=>{if(!e.target.dataset.mode)return;mode=e.target.dataset.mode;index=0;draw()});draw();
</script>
</html>
