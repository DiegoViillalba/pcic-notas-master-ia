<svg xmlns="http://www.w3.org/2000/svg" width="840" height="435" viewBox="0 0 840 435" role="img" aria-labelledby="title desc">
<title id="title">Observar un descendiente activa el colisionador</title><desc id="desc">X y Z apuntan a Y, y Y apunta a D. Sin evidencia el camino X Y Z queda bloqueado. Al observar D, descendiente de Y, ese camino se activa aunque Y no se observe.</desc>
<style>
:root{color-scheme:light dark;--bg:#f8f7f3;--text:#192a32;--muted:#52626a;--node:#ffffff;--line:#9aaeb7;--accent:#186b80;--soft:#d9edf1;--blocked:#798992}
@media(prefers-color-scheme:dark){:root{--bg:#151e24;--text:#e7eff2;--muted:#b5c4cb;--node:#202d35;--line:#8a9fa9;--accent:#68becb;--soft:#254650;--blocked:#a2b0b6}}
text{font-family:system-ui,-apple-system,sans-serif;fill:var(--text)}
.title{font-size:26px;font-weight:600}.heading{font-size:21px;font-weight:600}.label{font-size:18px}.symbol{font-size:23px;font-weight:600}.caption{font-size:18px;fill:var(--muted)}.status{font-size:19px;font-weight:600}.factor{font-size:19px}
.node{fill:var(--node);stroke:var(--line);stroke-width:1.5}.observed{fill:var(--soft);stroke:var(--accent);stroke-width:2.5}
.edge{fill:none;stroke:var(--line);stroke-width:2}.active{stroke:var(--accent);stroke-width:2.5}.blocked{stroke:var(--blocked);stroke-dasharray:7 6;stroke-width:2}.separator{stroke:var(--line);stroke-width:1;opacity:.5}
</style>
<defs>
<marker id="arrow-normal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--line)"/></marker>
<marker id="arrow-active" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="arrow-blocked" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--blocked)"/></marker>
</defs>
<rect width="840" height="435" rx="10" fill="var(--bg)"/>
<text x="30" y="42" class="title" text-anchor="start">Observar un descendiente activa el colisionador</text>
<text x="220" y="93" class="heading" text-anchor="middle">Sin evidencia</text>
<line x1="220.00" y1="267.00" x2="220.00" y2="307.00" class="edge normal" marker-end="url(#arrow-normal)"/>
<line x1="124.38" y1="168.48" x2="195.62" y2="219.52" class="edge blocked" marker-end="url(#arrow-blocked)"/>
<line x1="315.62" y1="168.48" x2="244.38" y2="219.52" class="edge blocked" marker-end="url(#arrow-blocked)"/>
<ellipse cx="100" cy="151" rx="30" ry="30" class="node "/>
<text x="100" y="158" class="symbol" text-anchor="middle">X</text>
<ellipse cx="340" cy="151" rx="30" ry="30" class="node "/>
<text x="340" y="158" class="symbol" text-anchor="middle">Z</text>
<ellipse cx="220" cy="237" rx="30" ry="30" class="node "/>
<text x="220" y="244" class="symbol" text-anchor="middle">Y</text>
<ellipse cx="220" cy="337" rx="30" ry="30" class="node "/>
<text x="220" y="344" class="symbol" text-anchor="middle">D</text>
<text x="220" y="418" class="status" text-anchor="middle">X ⊥ Z</text>
<text x="620" y="93" class="heading" text-anchor="middle">Solo D observado</text>
<line x1="620.00" y1="267.00" x2="620.00" y2="307.00" class="edge normal" marker-end="url(#arrow-normal)"/>
<line x1="524.38" y1="168.48" x2="595.62" y2="219.52" class="edge active" marker-end="url(#arrow-active)"/>
<line x1="715.62" y1="168.48" x2="644.38" y2="219.52" class="edge active" marker-end="url(#arrow-active)"/>
<ellipse cx="500" cy="151" rx="30" ry="30" class="node "/>
<text x="500" y="158" class="symbol" text-anchor="middle">X</text>
<ellipse cx="740" cy="151" rx="30" ry="30" class="node "/>
<text x="740" y="158" class="symbol" text-anchor="middle">Z</text>
<ellipse cx="620" cy="237" rx="30" ry="30" class="node "/>
<text x="620" y="244" class="symbol" text-anchor="middle">Y</text>
<ellipse cx="620" cy="337" rx="30" ry="30" class="node observed"/>
<text x="620" y="344" class="symbol" text-anchor="middle">D</text>
<text x="620" y="394" class="caption" text-anchor="middle">observado</text>
<text x="620" y="418" class="status" text-anchor="middle">Independencia no garantizada</text>
</svg>
