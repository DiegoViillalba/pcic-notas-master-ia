<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muestreo en la red de pasto mojado</title>
<style>
:root{color-scheme:light dark;--ink:light-dark(#172b34,#e8f0f2);--muted:light-dark(#526773,#b7c5cd);--line:light-dark(#cbd7dc,#40525c);--surface:light-dark(#edf5f6,#263943);--accent:light-dark(#087487,#69c9db);--target:light-dark(#b35e27,#f5ad68);--track:light-dark(#d9e6e9,#30444d)}
*{box-sizing:border-box}body{margin:0;padding:20px;color:var(--ink);background:transparent;font:16px/1.5 system-ui,sans-serif}main{max-width:960px;margin:auto}h1{font-size:1.4rem;line-height:1.25;margin:0 0 5px}h2{font-size:1.1rem;margin:22px 0 8px}p{margin:7px 0}.muted{color:var(--muted)}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:17px 0}.controls label{display:flex;flex:1 1 170px;flex-direction:column;gap:5px;font-weight:600}.controls label:first-child{flex-basis:230px}.controls input,.controls select,.controls button{font:inherit;min-height:42px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--ink);background:var(--surface)}.controls button{background:var(--accent);color:light-dark(#fff,#10272e);border-color:transparent;font-weight:700;flex:0 0 auto;cursor:pointer}.controls button:focus-visible,.controls input:focus-visible,.controls select:focus-visible{outline:3px solid var(--target);outline-offset:2px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:15px 0}.stat{padding:12px 14px;background:var(--surface);border-radius:7px}.stat span{display:block;color:var(--muted);font-size:.85rem}.stat strong{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.35}.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}.swatch{display:inline-block;width:15px;height:3px;vertical-align:middle;margin-right:5px;background:var(--accent)}.swatch.target{background:var(--target)}.chart-wrap{overflow-x:auto}svg{display:block;width:100%;height:auto;min-width:460px}svg text{fill:var(--muted);font:13px system-ui,sans-serif}svg .axis{stroke:var(--line);stroke-width:1}svg .gridline{stroke:var(--line);stroke-width:1;opacity:.65}svg .target{stroke:var(--target);stroke-width:2;stroke-dasharray:7 5}svg .series{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}svg .point{fill:var(--accent)}.details{font-variant-numeric:tabular-nums}.note{padding-top:12px;border-top:1px solid var(--line)}@media(max-width:600px){body{padding:12px}.grid{grid-template-columns:1fr}.controls label{flex-basis:100%}.controls button{width:100%}}@media(prefers-reduced-motion:no-preference){svg .series{transition:d .3s ease}}
</style>
</head>
<body>
<main id="ia16-sampling-lab">
<h1>Muestreo en la red de pasto mojado</h1>
<p class="muted">Modelo: C → S, C → R, S → W, R → W. «+» significa verdadero. Cada corrida usa una semilla reproducible.</p>
<div class="controls">
  <label for="method">Método
    <select id="method">
      <option value="prior">Previo · P(+w)</option>
      <option value="reject">Rechazo · P(+c | +w)</option>
      <option value="weighted">Verosimilitud con pesos · P(+c | +w)</option>
      <option value="gibbs">Gibbs · P(+c | +w)</option>
    </select>
  </label>
  <label for="count">Intentos o muestras
    <select id="count"><option value="20">20</option><option value="100">100</option><option value="500" selected>500</option><option value="2000">2,000</option><option value="5000">5,000</option></select>
  </label>
  <label for="seed">Semilla
    <input id="seed" type="number" min="0" max="4294967295" step="1" value="16" inputmode="numeric">
  </label>
  <button type="button" id="run">Simular</button>
</div>
<p id="method-explanation"></p>
<div class="grid" aria-live="polite">
  <div class="stat"><span>Estimación de esta corrida</span><strong id="estimate">—</strong></div>
  <div class="stat"><span>Valor exacto de las CPT</span><strong id="exact">—</strong></div>
  <div class="stat"><span id="useful-label">Muestras útiles</span><strong id="useful">—</strong></div>
</div>
<h2>Cómo se acerca la estimación</h2>
<div class="legend"><span><i class="swatch"></i>Estimación acumulada</span><span><i class="swatch target"></i>Valor exacto</span></div>
<div class="chart-wrap"><svg id="chart" viewBox="0 0 700 260" role="img" aria-label="Estimación acumulada frente al valor exacto, desde cero hasta el número de intentos o muestras seleccionado"></svg></div>
<p class="details" id="details" aria-live="polite"></p>
<p class="note muted" id="caveat"></p>
<noscript>Para usar el simulador, activa JavaScript. Con las CPT de la clase, P(+w)=0.65 y P(+c | +w)≈0.574615.</noscript>
</main>
<script>
(()=>{
'use strict';
const root=document.getElementById('ia16-sampling-lab');
const el=id=>root.querySelector('#'+id);
const P={c:.5,s1:.1,s0:.5,r1:.8,r0:.2};
const pw=(s,r)=>s?(r?.99:.90):(r?.90:.01);
const ps=c=>c?P.s1:P.s0;
const pr=c=>c?P.r1:P.r0;
const bern=(rng,p)=>rng()<p?1:0;
const fmt=x=>x===null||!Number.isFinite(x)?'—':x.toFixed(4);
function rngFor(seed){let a=seed>>>0;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function priorWorld(rng){const c=bern(rng,P.c),s=bern(rng,ps(c)),r=bern(rng,pr(c)),w=bern(rng,pw(s,r));return{c,s,r,w};}
function conditional(rng,forTrue,forFalse){const total=forTrue+forFalse;return bern(rng,forTrue/total);}
function gibbsSweep(state,rng){
  state.c=conditional(rng,P.c*(state.s?ps(1):1-ps(1))*(state.r?pr(1):1-pr(1)),(1-P.c)*(state.s?ps(0):1-ps(0))*(state.r?pr(0):1-pr(0)));
  state.s=conditional(rng,ps(state.c)*pw(1,state.r),(1-ps(state.c))*pw(0,state.r));
  state.r=conditional(rng,pr(state.c)*pw(state.s,1),(1-pr(state.c))*pw(state.s,0));
}
function simulate(method,n,seed){
  const rng=rngFor(seed),points=[],stride=Math.max(1,Math.floor(n/120));
  let numerator=0,denominator=0,sumW2=0,accepted=0,estimate=null;
  const state={c:bern(rng,.5),s:bern(rng,.5),r:bern(rng,.5)};
  if(method==='gibbs')for(let i=0;i<200;i++)gibbsSweep(state,rng);
  for(let i=1;i<=n;i++){
    if(method==='prior'){
      const x=priorWorld(rng);numerator+=x.w;denominator=i;
    }else if(method==='reject'){
      const x=priorWorld(rng);if(x.w){accepted++;numerator+=x.c;denominator++;}
    }else if(method==='weighted'){
      const c=bern(rng,P.c),s=bern(rng,ps(c)),r=bern(rng,pr(c)),w=pw(s,r);
      numerator+=w*c;denominator+=w;sumW2+=w*w;
    }else{
      gibbsSweep(state,rng);numerator+=state.c;denominator=i;
    }
    estimate=denominator>0?numerator/denominator:null;
    if(i===1||i%stride===0||i===n)points.push({i,value:estimate});
  }
  return{estimate,points,accepted,ess:sumW2?denominator*denominator/sumW2:0,denominator};
}
function chart(points,n,target){
  const svg=el('chart'),left=48,right=680,top=15,bottom=222,width=right-left,height=bottom-top;
  const x=i=>left+(i-1)/Math.max(1,n-1)*width,y=v=>bottom-v*height;
  let parts=['<title>Trayectoria de la estimación</title><desc>La curva indica la estimación acumulada; la línea punteada indica el valor exacto.</desc>'];
  for(const v of [0,.25,.5,.75,1])parts.push(`<line class="gridline" x1="${left}" y1="${y(v)}" x2="${right}" y2="${y(v)}"/><text x="${left-10}" y="${y(v)+5}" text-anchor="end">${v.toFixed(2)}</text>`);
  parts.push(`<line class="axis" x1="${left}" y1="${bottom}" x2="${right}" y2="${bottom}"/>`);
  parts.push(`<line class="target" x1="${left}" y1="${y(target)}" x2="${right}" y2="${y(target)}"/>`);
  let segment=[];const flush=()=>{if(segment.length){parts.push(`<path class="series" d="${segment.join(' ')}"/>`);segment=[];}};
  for(const p of points){if(p.value===null){flush();continue;}segment.push(`${segment.length?'L':'M'}${x(p.i).toFixed(1)},${y(p.value).toFixed(1)}`);}flush();
  const last=points[points.length-1];if(last?.value!==null)parts.push(`<circle class="point" cx="${x(last.i)}" cy="${y(last.value)}" r="4"/>`);
  parts.push(`<text x="${left}" y="248" text-anchor="start">1</text><text x="${right}" y="248" text-anchor="end">${n.toLocaleString('es-MX')} pasos</text>`);
  svg.innerHTML=parts.join('');
}
const descriptions={
  prior:'Genera C, S, R y W desde sus CPT y cuenta cuántos mundos tienen +w.',
  reject:'Genera mundos completos. Conserva solo los que traen +w y, entre ellos, cuenta +c.',
  weighted:'Fija W=+w. Sortea C, S y R; cada mundo pesa P(+w | S,R).',
  gibbs:'Fija W=+w. Tras 200 barridos de calentamiento, actualiza C, S y R una vez por barrido y cuenta +c.'
};
function render(){
  const method=el('method').value,n=Number(el('count').value);
  const raw=Number(el('seed').value),seed=Number.isInteger(raw)&&raw>=0&&raw<=4294967295?raw:16;
  el('seed').value=String(seed);
  const result=simulate(method,n,seed),target=method==='prior'?.65:.3735/.65;
  el('method-explanation').textContent=descriptions[method];
  el('estimate').textContent=fmt(result.estimate);el('exact').textContent=fmt(target);
  let label,used,details,caveat;
  if(method==='prior'){
    label='Mundos generados';used=n.toLocaleString('es-MX');
    details=`${Math.round(result.denominator*result.estimate)} de ${n} mundos tuvieron +w.`;
    caveat='La consulta es P(+w), sin evidencia. Una muestra finita puede fluctuar alrededor de 0.65.';
  }else if(method==='reject'){
    label='Mundos aceptados';used=result.accepted.toLocaleString('es-MX');
    details=`Aceptación: ${(100*result.accepted/n).toFixed(1)} %. En este modelo P(+w)=65 %, por lo que la tasa se acerca a 65 % con muchos intentos.`;
    caveat=result.accepted?'La estimación usa solo mundos aceptados. Si la evidencia fuera rara, casi todos los intentos se perderían.':'No hubo muestras compatibles: esta corrida no define una estimación; aumenta los intentos.';
  }else if(method==='weighted'){
    label='Tamaño efectivo aprox.';used=result.ess.toFixed(1);
    details=`Se generaron ${n.toLocaleString('es-MX')} mundos ponderados. Suma de pesos: ${result.denominator.toFixed(2)}; tamaño efectivo: ${(result.ess/n*100).toFixed(1)} % de N.`;
    caveat='El tamaño efectivo describe la desigualdad de los pesos; no equivale a una garantía de precisión.';
  }else{
    label='Estados contados';used=n.toLocaleString('es-MX');
    details=`200 barridos de calentamiento + ${n.toLocaleString('es-MX')} barridos contados. Cada barrido actualiza C, S y R una vez.`;
    caveat='Los estados consecutivos comparten historia y están correlacionados. N estados no equivalen a N muestras independientes.';
  }
  el('useful-label').textContent=label;el('useful').textContent=used;
  el('details').textContent=details;el('caveat').textContent=caveat;
  chart(result.points,n,target);
  root.dataset.method=method;root.dataset.estimate=String(result.estimate);root.dataset.exact=String(target);root.dataset.useful=String(used);
}
el('run').addEventListener('click',render);
el('method').addEventListener('change',render);
el('count').addEventListener('change',render);
el('seed').addEventListener('change',render);
render();
})();
</script>
</body>
</html>
