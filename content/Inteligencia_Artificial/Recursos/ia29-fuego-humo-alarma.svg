<svg xmlns="http://www.w3.org/2000/svg" width="840" height="625" viewBox="0 0 840 625" role="img" aria-labelledby="title desc">
<title id="title">Fuego, humo y alarma: dos modelos posibles</title><desc id="desc">La cadena F a H a A supone A independiente de F dado H. La causa común F a H y F a A supone H independiente de A dado F. Son hipótesis de modelado diferentes.</desc>
<style>
:root{color-scheme:light dark;--bg:#f8f7f3;--text:#192a32;--muted:#52626a;--node:#ffffff;--line:#9aaeb7;--accent:#186b80;--soft:#d9edf1;--blocked:#798992}
@media(prefers-color-scheme:dark){:root{--bg:#151e24;--text:#e7eff2;--muted:#b5c4cb;--node:#202d35;--line:#8a9fa9;--accent:#68becb;--soft:#254650;--blocked:#a2b0b6}}
text{font-family:system-ui,-apple-system,sans-serif;fill:var(--text)}
.title{font-size:26px;font-weight:600}.heading{font-size:21px;font-weight:600}.label{font-size:18px}.symbol{font-size:23px;font-weight:600}.caption{font-size:18px;fill:var(--muted)}.status{font-size:19px;font-weight:600}.factor{font-size:19px}
.node{fill:var(--node);stroke:var(--line);stroke-width:1.5}.observed{fill:var(--soft);stroke:var(--accent);stroke-width:2.5}
.edge{fill:none;stroke:var(--line);stroke-width:2}.active{stroke:var(--accent);stroke-width:2.5}.blocked{stroke:var(--blocked);stroke-dasharray:7 6;stroke-width:2}.separator{stroke:var(--line);stroke-width:1;opacity:.5}
</style>
<defs>
<marker id="arrow-normal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--line)"/></marker>
<marker id="arrow-active" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--accent)"/></marker>
<marker id="arrow-blocked" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--blocked)"/></marker>
</defs>
<rect width="840" height="625" rx="10" fill="var(--bg)"/>
<text x="30" y="42" class="title" text-anchor="start">Fuego, humo y alarma: dos modelos posibles</text>
<text x="30" y="89" class="heading" text-anchor="start">Detector que responde al humo</text>
<line x1="245.00" y1="168.00" x2="330.00" y2="168.00" class="edge normal" marker-end="url(#arrow-normal)"/>
<line x1="510.00" y1="168.00" x2="595.00" y2="168.00" class="edge normal" marker-end="url(#arrow-normal)"/>
<ellipse cx="155" cy="168" rx="90" ry="46" class="node "/>
<text x="155" y="164" class="symbol" text-anchor="middle">F</text>
<text x="155" y="190" class="label" text-anchor="middle">fuego</text>
<ellipse cx="420" cy="168" rx="90" ry="46" class="node "/>
<text x="420" y="164" class="symbol" text-anchor="middle">H</text>
<text x="420" y="190" class="label" text-anchor="middle">humo</text>
<ellipse cx="685" cy="168" rx="90" ry="46" class="node "/>
<text x="685" y="164" class="symbol" text-anchor="middle">A</text>
<text x="685" y="190" class="label" text-anchor="middle">alarma</text>
<text x="420" y="249" class="factor" text-anchor="middle">Supuesto: A ⊥ F | H</text>
<line x1="30" y1="285" x2="810" y2="285" class="separator"/>
<text x="30" y="329" class="heading" text-anchor="start">Dos efectos de una causa común</text>
<line x1="361.35" y1="435.89" x2="283.65" y2="482.11" class="edge normal" marker-end="url(#arrow-normal)"/>
<line x1="478.65" y1="435.89" x2="556.35" y2="482.11" class="edge normal" marker-end="url(#arrow-normal)"/>
<ellipse cx="420" cy="401" rx="90" ry="46" class="node "/>
<text x="420" y="397" class="symbol" text-anchor="middle">F</text>
<text x="420" y="423" class="label" text-anchor="middle">fuego</text>
<ellipse cx="225" cy="517" rx="90" ry="46" class="node "/>
<text x="225" y="513" class="symbol" text-anchor="middle">H</text>
<text x="225" y="539" class="label" text-anchor="middle">humo</text>
<ellipse cx="615" cy="517" rx="90" ry="46" class="node "/>
<text x="615" y="513" class="symbol" text-anchor="middle">A</text>
<text x="615" y="539" class="label" text-anchor="middle">alarma</text>
<text x="420" y="604" class="factor" text-anchor="middle">Supuesto: H ⊥ A | F</text>
</svg>
