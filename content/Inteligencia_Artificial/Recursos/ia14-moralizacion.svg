<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1030" viewBox="0 0 840 1030" role="img" aria-labelledby="t d">
<title id="t">Moralización: verificar d-separación con el subgrafo ancestral</title>
<desc id="d">R→T←B, T→T′.</desc>
