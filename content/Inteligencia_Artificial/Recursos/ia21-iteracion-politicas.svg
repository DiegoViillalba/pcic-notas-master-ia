<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 265" role="img" aria-labelledby="title desc">
<title id="title">Ciclo de iteración de políticas</title><desc id="desc">Se fija una política, se calcula su valor, se mejora con respecto a ese valor y se vuelve a evaluar. Si no cambia, es óptima bajo los supuestos del MDP finito descontado.</desc>
<style>
.bg{fill:#fafbf8} .label,.small,.title{fill:#202d36;font:18px system-ui,sans-serif} .small{font-size:16px} .title{font-size:22px;font-weight:600}
.box{fill:#eef1ec;stroke:#78868c;stroke-width:1.2} .blue{stroke:#185f9b} .orange{stroke:#a34e22} .edge{stroke:#78868c;stroke-width:1.8} .accent{fill:#185f9b} .arrowhead{fill:#78868c}
@media(prefers-color-scheme:dark){.bg{fill:#182128} .label,.small,.title{fill:#ecf0e9} .box{fill:#27333c;stroke:#9baab1} .blue{stroke:#8fc8ff} .orange{stroke:#ffb68b} .edge{stroke:#9baab1} .accent{fill:#8fc8ff} .arrowhead{fill:#9baab1}}
</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" class="arrowhead"/></marker></defs>
<rect class="bg" width="880" height="265" rx="12"/>
<text x="440" y="36" class="title" text-anchor="middle">Evaluar y mejorar resuelven preguntas distintas</text><rect x="30" y="91" width="225" height="82" rx="12" class="box "/><text x="142.5" y="121" class="label" text-anchor="middle">1. Fijar π</text><text x="142.5" y="147" class="small" text-anchor="middle">qué haré en cada estado</text><line x1="255" y1="131" x2="310" y2="131" class="edge " marker-end="url(#arrow)"/><rect x="320" y="91" width="240" height="82" rx="12" class="box "/><text x="440.0" y="121" class="label" text-anchor="middle">2. Evaluar Vπ</text><text x="440.0" y="147" class="small" text-anchor="middle">qué obtendré siguiendo π</text><line x1="560" y1="131" x2="615" y2="131" class="edge " marker-end="url(#arrow)"/><rect x="625" y="91" width="225" height="82" rx="12" class="box "/><text x="737.5" y="121" class="label" text-anchor="middle">3. Mejorar π</text><text x="737.5" y="147" class="small" text-anchor="middle">argmax de Qπ</text><path d="M738 177 L738 225 L145 225 L145 177" class="edge " fill="none" marker-end="url(#arrow)"/><text x="440" y="216" class="small" text-anchor="middle">Repetir hasta que la política permanezca igual.</text></svg>