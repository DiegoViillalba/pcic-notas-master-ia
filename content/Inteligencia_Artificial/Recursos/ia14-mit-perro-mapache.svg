<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" role="img" aria-labelledby="title desc">
<title id="title">MIT: causas alternativas de un ladrido</title>
<desc id="desc">B apunta a D; R apunta a D. P(B)=0.1; P(R)=0.5; B y R son independientes a priori.
Escuchar el ladrido puede relacionar las dos explicaciones.</desc>
<style>
svg{color-scheme:light dark;--bg:#fafbf9;--ink:#1d3035;--line:#536971;--node:#ffffff;--accent:#146879;--soft:#dceff0;--muted:#53646c}
@media(prefers-color-scheme:dark){svg{--bg:#182228;--ink:#edf3f4;--line:#a9bdc5;--node:#23333c;--accent:#81d2dc;--soft:#264c56;--muted:#bdcbd0}}
.canvas{fill:var(--bg)}text{font-family:system-ui,sans-serif;fill:var(--ink);text-anchor:middle} .heading{font-size:23px;font-weight:600}.label{font-size:18px}.small{font-size:16px;fill:var(--muted)}.symbol{font-size:24px;font-weight:600}.edge{stroke:var(--line);stroke-width:2;fill:none}.node{fill:var(--node);stroke:var(--line);stroke-width:1.7}.observed{fill:var(--soft);stroke:var(--accent);stroke-width:2.5}
</style>
<rect class="canvas" width="700" height="400" rx="12"/>
<text class="heading" x="350" y="36">MIT: causas alternativas de un ladrido</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--line)"/></marker></defs>
<line class="edge" x1="203.65" y1="121.56" x2="322.66" y2="230.07" marker-end="url(#arrow)"/>
<line class="edge" x1="496.35" y1="121.56" x2="377.34" y2="230.07" marker-end="url(#arrow)"/>
<circle class="node " cx="180" cy="100" r="32"/><text class="symbol" x="180" y="108">B</text><text class="label" x="227" y="106" style="text-anchor:start">Ladrón</text>
<circle class="node " cx="520" cy="100" r="32"/><text class="symbol" x="520" y="108">R</text><text class="label" x="567" y="106" style="text-anchor:start">Mapache</text>
<circle class="node " cx="350" cy="255" r="32"/><text class="symbol" x="350" y="263">D</text><text class="label" x="350" y="313" style="text-anchor:middle">Perro ladra</text>
<text class="small" x="350" y="360">P(B)=0.1; P(R)=0.5; B y R son independientes a priori.</text>
<text class="small" x="350" y="383">Escuchar el ladrido puede relacionar las dos explicaciones.</text>
</svg>
