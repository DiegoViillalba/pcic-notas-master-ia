<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Consistencia de arcos: del soporte a AC-3</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: var(--obsidian-bg, #f7f8fc);
      --fg: var(--obsidian-text, #202536);
      --muted: var(--obsidian-text-muted, #5d6473);
      --panel: var(--obsidian-bg-2, #ffffff);
      --line: var(--obsidian-border, #c9cedb);
      --btn-bg: var(--panel);
      --btn-fg: var(--fg);
      --btn-border: var(--line);
      --node-bg: var(--panel);
      --node-border: #8b93a5;
      --check-bg: #dbeafe;
      --check-border: #2563eb;
      --check-fg: #1e3a8a;
      --supp-bg: #dcfce7;
      --supp-border: #16a34a;
      --supp-fg: #14532d;
      --status-bg: #fff8dc;
      --status-border: #d97706;
      --status-fg: #78350f;
      --step-badge-bg: #e2e8f0;
      --step-badge-fg: #334155;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e222d;
        --fg: #eef0f5;
        --muted: #9aa2b2;
        --panel: #272c39;
        --line: #3d4455;
        --btn-bg: #2d3342;
        --btn-fg: #eef0f5;
        --btn-border: #4a5368;
        --node-bg: #272c39;
        --node-border: #5a6478;
        --check-bg: #1e3557;
        --check-border: #60a5fa;
        --check-fg: #bfdbfe;
        --supp-bg: #1a3d28;
        --supp-border: #4ade80;
        --supp-fg: #bbf7d0;
        --status-bg: #2c2414;
        --status-border: #f59e0b;
        --status-fg: #fde68a;
        --step-badge-bg: #323949;
        --step-badge-fg: #cbd5e1;
      }
    }
    :root[style*="color-scheme: dark"],
    :root[style*="--obsidian-color-scheme: dark"] {
      --bg: var(--obsidian-bg, #1e222d);
      --fg: var(--obsidian-text, #eef0f5);
      --muted: var(--obsidian-text-muted, #9aa2b2);
      --panel: var(--obsidian-bg-2, #272c39);
      --line: var(--obsidian-border, #3d4455);
      --btn-bg: #2d3342;
      --btn-fg: var(--fg);
      --btn-border: #4a5368;
      --node-bg: #272c39;
      --node-border: #5a6478;
      --check-bg: #1e3557;
      --check-border: #60a5fa;
      --check-fg: #bfdbfe;
      --supp-bg: #1a3d28;
      --supp-border: #4ade80;
      --supp-fg: #bbf7d0;
      --status-bg: #2c2414;
      --status-border: #f59e0b;
      --status-fg: #fde68a;
      --step-badge-bg: #323949;
      --step-badge-fg: #cbd5e1;
    }

    * { box-sizing: border-box; }
    body {
      font: 15px/1.45 system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
    }
    main { max-width: 760px; margin: auto; }
    .top, .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .top { justify-content: space-between; margin-bottom: 6px; }
    h2 { font-size: 20px; margin: 0; }
    button {
      padding: 7px 12px;
      border: 1px solid var(--btn-border);
      border-radius: 7px;
      background: var(--btn-bg);
      color: var(--btn-fg);
      font-weight: 600;
      cursor: pointer;
      transition: background-color .15s, opacity .15s;
    }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:disabled { opacity: .35; cursor: not-allowed; }
    #count {
      font-weight: 700;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--step-badge-bg);
      color: var(--step-badge-fg);
      border: 1px solid var(--line);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 20px;
      margin: 14px 0;
    }
    .var { text-align: center; }
    .name { font-weight: 700; font-size: 18px; }
    .values {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .v {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid var(--node-border);
      background: var(--node-bg);
      color: var(--fg);
      font-weight: 700;
      transition: all .2s ease;
    }
    .supported {
      background: var(--supp-bg) !important;
      border-color: var(--supp-border) !important;
      color: var(--supp-fg) !important;
    }
    .check {
      background: var(--check-bg) !important;
      border-color: var(--check-border) !important;
      color: var(--check-fg) !important;
    }
    .removed {
      opacity: .35;
      text-decoration: line-through;
      color: var(--muted) !important;
      border-color: var(--line) !important;
      background: transparent !important;
    }
    .arrow { font-size: 30px; color: var(--fg); }
    .hint {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      margin: -4px 0 10px;
    }
    .queue {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 10px 12px;
      background: var(--panel);
      color: var(--fg);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .status {
      margin-top: 10px;
      padding: 11px 14px;
      border-left: 4px solid var(--status-border);
      background: var(--status-bg);
      color: var(--status-fg);
      border-radius: 0 8px 8px 0;
      min-height: 52px;
      font-size: 14px;
      line-height: 1.5;
    }
    .status b { color: var(--fg); }
    @media (max-width: 480px) {
      .grid { gap: 8px; }
      .v { width: 36px; height: 36px; }
    }
  </style>
</head>
<body>
<main>
  <div class="top">
    <h2>Del soporte a AC-3</h2>
    <div class="controls">
      <button id="prev" type="button" aria-label="Ir al paso anterior">← Atrás</button>
      <span id="count" aria-live="polite"></span>
      <button id="next" type="button" aria-label="Ir al paso siguiente">Siguiente →</button>
    </div>
  </div>
  <div class="grid">
    <section class="var">
      <div class="name">D(X)</div>
      <div class="values" id="xvals"></div>
    </section>
    <div class="arrow" id="arrow" aria-label="Dirección del arco">→</div>
    <section class="var">
      <div class="name">D(Y)</div>
      <div class="values" id="yvals"></div>
    </section>
  </div>
  <div class="hint">Azul: valor revisado · Verde: soporte · Tachado: eliminado</div>
  <div class="queue" id="queue"></div>
  <div class="status" id="status" aria-live="polite"></div>
</main>
<script>
  const steps = [
    {dx:[1,2,3], dy:[2], arc:'X → Y', cx:null, sy:[], q:['X→Y','Y→X'], t:'Restricción X < Y. AC-3 toma el arco X → Y de la cola.'},
    {dx:[1,2,3], dy:[2], arc:'X → Y', cx:1, sy:[2], q:['Y→X'], t:'x=1 tiene soporte: y=2 cumple 1 < 2. Se conserva.'},
    {dx:[1,2,3], dy:[2], arc:'X → Y', cx:2, sy:[], q:['Y→X'], t:'x=2 no tiene ningún y con 2 < y. Se elimina del dominio de X.'},
    {dx:[1,3], dy:[2], arc:'X → Y', cx:3, sy:[], q:['Y→X'], t:'x=3 tampoco tiene soporte. Se elimina.'},
    {dx:[1], dy:[2], arc:'Y → X', cx:null, sy:[2], q:[], t:'Se revisa el arco inverso. y=2 tiene soporte x=1. Ambos arcos son consistentes.'},
    {dx:[1], dy:[2], arc:'fin', cx:null, sy:[], q:[], t:'Resultado: D(X)={1}, D(Y)={2}. Aquí la propagación encontró una solución única sin ramificar.'}
  ];
  let i = 0;
  const xvals = document.getElementById('xvals');
  const yvals = document.getElementById('yvals');
  const arrow = document.getElementById('arrow');
  const queue = document.getElementById('queue');
  const status = document.getElementById('status');
  const count = document.getElementById('count');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');

  function vals(el, arr, current, support) {
    el.innerHTML = [1,2,3].map(v => {
      const isPresent = arr.includes(v);
      const isCheck = v === current;
      const isSupport = support.includes(v);
      return `<span class="v ${isPresent ? '' : 'removed'} ${isCheck ? 'check' : ''} ${isSupport ? 'supported' : ''}">${v}</span>`;
    }).join('');
  }

  function draw() {
    let s = steps[i];
    vals(xvals, s.dx, s.cx, []);
    vals(yvals, s.dy, null, s.sy);
    arrow.textContent = s.arc === 'Y → X' ? '←' : '→';
    queue.textContent = 'Cola de arcos: [' + s.q.join(', ') + ']';
    status.innerHTML = '<b>' + s.arc + '</b> · ' + s.t;
    count.textContent = `Paso ${i + 1}/${steps.length}`;
    prev.disabled = i === 0;
    next.disabled = i === steps.length - 1;
  }

  prev.onclick = () => { if (i > 0) { i--; draw(); } };
  next.onclick = () => { if (i < steps.length - 1) { i++; draw(); } };
  draw();
</script>
</body>
</html>
