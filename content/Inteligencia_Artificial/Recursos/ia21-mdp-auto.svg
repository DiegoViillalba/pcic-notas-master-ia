<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-labelledby="title desc">
<title id="title">Modelo completo del automóvil</title><desc id="desc">Cada fila da un estado y una acción, con todos sus sucesores, probabilidades y recompensas. Overheated es terminal; la penalización ocurre al entrar.</desc>
<style>
.bg{fill:#fafbf8} .label,.small,.title{fill:#202d36;font:18px system-ui,sans-serif} .small{font-size:16px} .title{font-size:22px;font-weight:600}
.box{fill:#eef1ec;stroke:#78868c;stroke-width:1.2} .blue{stroke:#185f9b} .orange{stroke:#a34e22} .edge{stroke:#78868c;stroke-width:1.8} .accent{fill:#185f9b} .arrowhead{fill:#78868c}
@media(prefers-color-scheme:dark){.bg{fill:#182128} .label,.small,.title{fill:#ecf0e9} .box{fill:#27333c;stroke:#9baab1} .blue{stroke:#8fc8ff} .orange{stroke:#ffb68b} .edge{stroke:#9baab1} .accent{fill:#8fc8ff} .arrowhead{fill:#9baab1}}
</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" class="arrowhead"/></marker></defs>
<rect class="bg" width="880" height="400" rx="12"/>
<text x="440" y="35" class="title" text-anchor="middle">Un estado + una acción → una distribución de resultados</text><rect x="35" y="68" width="260" height="62" rx="12" class="box "/><text x="165.0" y="98" class="label" text-anchor="middle">Cool · Slow</text><line x1="295" y1="99" x2="380" y2="99" class="edge " marker-end="url(#arrow)"/><rect x="390" y="68" width="450" height="62" rx="12" class="box "/><text x="615.0" y="98" class="label" text-anchor="middle">Cool: p = 1, recompensa +1</text><rect x="35" y="146" width="260" height="62" rx="12" class="box "/><text x="165.0" y="176" class="label" text-anchor="middle">Cool · Fast</text><line x1="295" y1="177" x2="380" y2="177" class="edge " marker-end="url(#arrow)"/><rect x="390" y="146" width="450" height="62" rx="12" class="box "/><text x="615.0" y="176" class="label" text-anchor="middle">Cool: p = 0.5, +2  /  Warm: p = 0.5, +2</text><rect x="35" y="224" width="260" height="62" rx="12" class="box "/><text x="165.0" y="254" class="label" text-anchor="middle">Warm · Slow</text><line x1="295" y1="255" x2="380" y2="255" class="edge " marker-end="url(#arrow)"/><rect x="390" y="224" width="450" height="62" rx="12" class="box "/><text x="615.0" y="254" class="label" text-anchor="middle">Cool: p = 0.5, +1  /  Warm: p = 0.5, +1</text><rect x="35" y="302" width="260" height="62" rx="12" class="box orange"/><text x="165.0" y="332" class="label" text-anchor="middle">Warm · Fast</text><line x1="295" y1="333" x2="380" y2="333" class="edge " marker-end="url(#arrow)"/><rect x="390" y="302" width="450" height="62" rx="12" class="box orange"/><text x="615.0" y="332" class="label" text-anchor="middle">Overheated: p = 1, recompensa −10</text><text x="440" y="387" class="small" text-anchor="middle">Tras llegar a Overheated, no hay más recompensas: V(Overheated) = 0.</text></svg>