<svg xmlns="http://www.w3.org/2000/svg" width="700" height="550" viewBox="0 0 700 550" role="img" aria-labelledby="title desc">
<title id="title">Ejemplo 3: deben bloquearse todos los caminos</title>
<desc id="desc">R apunta a T; R apunta a D; T apunta a S; D apunta a S. Camino superior: T ← R → D. Camino inferior: T → S ← D.
Observar R bloquea el superior; observar S abre el inferior.</desc>
<style>
svg{color-scheme:light dark;--bg:#fafbf9;--ink:#1d3035;--line:#536971;--node:#ffffff;--accent:#146879;--soft:#dceff0;--muted:#53646c}
@media(prefers-color-scheme:dark){svg{--bg:#182228;--ink:#edf3f4;--line:#a9bdc5;--node:#23333c;--accent:#81d2dc;--soft:#264c56;--muted:#bdcbd0}}
.canvas{fill:var(--bg)}text{font-family:system-ui,sans-serif;fill:var(--ink);text-anchor:middle} .heading{font-size:23px;font-weight:600}.label{font-size:18px}.small{font-size:16px;fill:var(--muted)}.symbol{font-size:24px;font-weight:600}.edge{stroke:var(--line);stroke-width:2;fill:none}.node{fill:var(--node);stroke:var(--line);stroke-width:1.7}.observed{fill:var(--soft);stroke:var(--accent);stroke-width:2.5}
</style>
<rect class="canvas" width="700" height="550" rx="12"/>
<text class="heading" x="350" y="36">Ejemplo 3: deben bloquearse todos los caminos</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--line)"/></marker></defs>
<line class="edge" x1="326.08" y1="121.26" x2="197.65" y2="235.42" marker-end="url(#arrow)"/>
<line class="edge" x1="373.92" y1="121.26" x2="502.35" y2="235.42" marker-end="url(#arrow)"/>
<line class="edge" x1="193.92" y1="281.26" x2="322.35" y2="395.42" marker-end="url(#arrow)"/>
<line class="edge" x1="506.08" y1="281.26" x2="377.65" y2="395.42" marker-end="url(#arrow)"/>
<circle class="node " cx="350" cy="100" r="32"/><text class="symbol" x="350" y="108">R</text><text class="label" x="397" y="106" style="text-anchor:start">Lluvia</text>
<circle class="node " cx="170" cy="260" r="32"/><text class="symbol" x="170" y="268">T</text><text class="label" x="217" y="266" style="text-anchor:start">Tráfico</text>
<circle class="node " cx="530" cy="260" r="32"/><text class="symbol" x="530" y="268">D</text><text class="label" x="577" y="266" style="text-anchor:start">Goteo</text>
<circle class="node " cx="350" cy="420" r="32"/><text class="symbol" x="350" y="428">S</text><text class="label" x="350" y="478" style="text-anchor:middle">Tristeza</text>
<text class="small" x="350" y="510">Camino superior: T ← R → D. Camino inferior: T → S ← D.</text>
<text class="small" x="350" y="533">Observar R bloquea el superior; observar S abre el inferior.</text>
</svg>
